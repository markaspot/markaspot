services:
  markaspot.profile_config_guard:
    class: Drupal\markaspot\EventSubscriber\ProfileConfigGuardSubscriber
    arguments:
      - '@extension.list.module'
      - '@config.storage'
      - '%install_profile%'
      - '@logger.channel.markaspot'
      - '@extension.list.profile'
    tags:
      - { name: event_subscriber }

  logger.channel.markaspot:
    parent: logger.channel_base
    arguments: ['markaspot']

  # Presave guards of the profile modules skip trusted system runs (drush,
  # updatedb, install). Look it up with hasService(): missing = untrusted.
  markaspot.system_write_context:
    class: Drupal\markaspot\Access\SystemWriteContext
    arguments: ['@kernel']
