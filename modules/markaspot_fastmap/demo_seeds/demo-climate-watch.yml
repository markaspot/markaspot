      es: 'Esquina bajo el agua tras la lluvia fuerte'
      fr: 'Coin de rue sous l''eau après une forte pluie'
      de: 'Ecke steht nach Starkregen unter Wasser'
    description:
      en: 'After today''s downpour the water stood ankle-deep at this corner. The drain could not take it, and people had to walk through the water.'
      es: 'Después del chaparrón de hoy el agua llegaba a los tobillos en esta esquina. El sumidero no daba abasto y la gente tuvo que cruzar por el agua.'
      fr: 'Après l''averse d''aujourd''hui, l''eau montait jusqu''aux chevilles à ce coin de rue. La bouche d''égout ne suffisait pas et les gens ont dû marcher dans l''eau.'
      de: 'Nach dem Wolkenbruch heute stand das Wasser an dieser Ecke knöcheltief. Der Gully hat es nicht geschafft, die Leute mussten durchs Wasser laufen.'
    history:
      - status: received
        days_ago: 58
        note:
          en: 'Thank you, we have received your entry.'
          es: 'Gracias, hemos recibido tu entrada.'
          fr: 'Merci, nous avons bien reçu votre saisie.'
          de: 'Danke, dein Eintrag ist eingegangen.'
      - status: under-review
        days_ago: 57
        time: '21:00'
        note:
          en: 'Thank you for the photo. One heavy shower is not enough for us to mark a flooding spot. We will look at the corner again after the next heavy rain.'
          es: 'Gracias por la foto. Un solo chaparrón no basta para marcar una zona inundable. Volveremos a mirar la esquina después de la próxima lluvia fuerte.'
          fr: 'Merci pour la photo. Une seule averse ne suffit pas pour marquer une zone inondable. Nous reviendrons voir ce coin après la prochaine forte pluie.'
          de: 'Danke für das Foto. Ein einzelner Wolkenbruch reicht uns nicht, um eine Überflutungsstelle zu markieren. Wir schauen uns die Ecke nach dem nächsten Starkregen noch einmal an.'
      - status: confirmed
        days_ago: 44
        time: '19:30'
        note:
          en: 'Confirmed. After the heavy rain this week a member saw the same: water ankle-deep at the corner for about an hour. The spot is in our report as a flooding spot.'
          es: 'Confirmado. Tras la lluvia fuerte de esta semana un miembro vio lo mismo: agua hasta los tobillos en la esquina durante casi una hora. El lugar figura en nuestro informe como zona inundable.'
          fr: 'Confirmé. Après la forte pluie de cette semaine, un membre a constaté la même chose : de l''eau jusqu''aux chevilles au coin de la rue pendant près d''une heure. L''endroit figure dans notre rapport comme zone inondable.'
          de: 'Bestätigt. Nach dem Starkregen diese Woche hat ein Mitglied dasselbe gesehen: knöcheltiefes Wasser an der Ecke, etwa eine Stunde lang. Die Stelle steht als Überflutungsstelle in unserem Bericht.'

