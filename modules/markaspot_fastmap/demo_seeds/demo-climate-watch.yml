# Template demo: climate-watch ("Climate observation map", DE "Hitze- und Hochwasserkarte").
# Format: README.md of the demo seeds. Real geometry, fictional names: the
# pins lie in the real town centre of Hamm (Westphalia), placed with
# OpenStreetMap data at real squares, car parks, bus stops and ring road
# parks. The group "Grüne Mitte", the people and all entries are fictional.
# No addresses are given on purpose: the geocoder fills them.
# Story: a citizen-science group runs the map. It checks every observation
# with a second observation or a simple measurement and marks it confirmed
# or not confirmed. Confirmed observations go into one report a year for
# the city's climate adaptation team; nothing is handed over one by one and
# the city never answers here.
# Entries are observations of a state, not cases: the closed statuses
# "Confirmed" and "Not confirmed" describe the observation, not repair work.
# Only observation categories (no wishes, those belong to neighbourhood).
# Times: heat is observed in the afternoon, flooding after showers, the group
# answers in the evening; entries without a time get a stable derived one.
# The statuses mirror the climate-watch set in
# WorkspaceProvisioningService::STATUS_TEMPLATES exactly (keys, names,
# mappings).
version: 1
slug: demo-climate-watch
template: climate-watch
seed_version: 2
default_language: en
languages: [en, es, fr, de]
wording: entry
name: 'Grüne Mitte Climate Watch'
claim:
  en: 'Observe local climate impacts'
  es: 'Observar los efectos del clima'
  fr: 'Observer les effets du climat'
  de: 'Klimafolgen vor Ort beobachten'
map:
  lat: 51.6805
  lng: 7.8180
  zoom: 16
boundary:
  radius_km: 0.7
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: received
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-plus
    name: { en: 'Observation received', es: 'Observación recibida', fr: 'Observation reçue', de: 'Beobachtung eingegangen' }
  - key: under-review
    mapping: open
    hex: '#2563EB'
    icon: i-lucide-search
    name: { en: 'Under review', es: 'En revisión', fr: 'En cours de vérification', de: 'In Prüfung' }
  - key: confirmed
    mapping: closed
    hex: '#059669'
    icon: i-lucide-badge-check
    name: { en: 'Confirmed', es: 'Confirmado', fr: 'Confirmé', de: 'Bestätigt' }
  - key: not-confirmed
    mapping: closed
    hex: '#64748B'
    icon: i-lucide-circle-x
    name: { en: 'Not confirmed', es: 'No confirmado', fr: 'Non confirmé', de: 'Nicht bestätigt' }

# Names and icons follow the climate-watch template after the rethink
# (template-registry.ts, useTemplates.ts categoryIcons in the
# demo-live-preview worktree), in the same order.
categories:
  - key: heat
    icon: i-lucide-thermometer-sun
    name: { en: 'Heat hotspot', es: 'Isla de calor', fr: 'Îlot de chaleur', de: 'Hitzeinsel' }
  - key: flooding
    icon: i-lucide-waves
    name: { en: 'Flooding spot', es: 'Zona inundable', fr: 'Zone inondable', de: 'Überflutungsstelle' }
  - key: shade
    icon: i-lucide-tree-deciduous
    name: { en: 'Missing shade', es: 'Sombra faltante', fr: 'Ombre manquante', de: 'Fehlender Schatten' }
  - key: sealed
    icon: i-lucide-layers
    name: { en: 'Sealed surface', es: 'Superficie sellada', fr: 'Surface imperméable', de: 'Versiegelte Fläche' }
  - key: drought
    icon: i-lucide-sprout
    name: { en: 'Drought damage or tree loss', es: 'Daño por sequía o pérdida de árboles', fr: 'Dégâts dus à la sécheresse ou perte d''arbres', de: 'Trockenschaden oder Baumverlust' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature. The city appears only in the notes, as the recipient of the
# yearly report.
organisations: []

start_page:
  title:
    en: 'Welcome to Grüne Mitte Climate Watch'
    es: 'Bienvenido al mapa climático de Grüne Mitte'
    fr: 'Bienvenue sur la carte climatique de Grüne Mitte'
    de: 'Willkommen bei der Klimakarte von Grüne Mitte'
  body:
    en: '<p>Residents of the town centre enter what they observe here: squares that get very hot, flooding after heavy rain, waiting points without shade, sealed surfaces and dried-out trees. The citizen-science group Grüne Mitte checks every entry with a second observation or a simple measurement and marks it as confirmed or not confirmed. Many small observations add up to a picture of heat and water, street by street. Once a year the group hands its report to the city''s climate adaptation team.</p><p>These are observations by residents, not an official assessment.</p><p>This is a demo. The group Grüne Mitte and all entries are fictional; the streets on the map are real. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Aquí los vecinos del centro anotan lo que observan: plazas que se calientan mucho, inundaciones tras lluvias fuertes, paradas sin sombra, superficies selladas y árboles secos. El grupo de ciencia ciudadana Grüne Mitte comprueba cada entrada con una segunda observación o una medición sencilla y la marca como confirmada o no confirmada. Muchas observaciones pequeñas forman, calle a calle, una imagen del calor y del agua. Una vez al año el grupo entrega su informe al equipo de adaptación climática del ayuntamiento.</p><p>Son observaciones de los vecinos, no una evaluación oficial.</p><p>Esto es una demostración. El grupo Grüne Mitte y todas las entradas son ficticios; las calles del mapa son reales. Todo lo que añadas se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Les habitants du centre-ville saisissent ici ce qu''ils observent : places qui deviennent brûlantes, inondations après de fortes pluies, arrêts sans ombre, surfaces imperméables et arbres desséchés. Le groupe de sciences participatives Grüne Mitte vérifie chaque saisie par une deuxième observation ou une mesure simple et la marque comme confirmée ou non confirmée. De nombreuses petites observations dessinent, rue par rue, une image de la chaleur et de l''eau. Une fois par an, le groupe remet son rapport à l''équipe d''adaptation climatique de la ville.</p><p>Ce sont des observations d''habitants, pas une évaluation officielle.</p><p>Ceci est une démo. Le groupe Grüne Mitte et toutes les saisies sont fictifs ; les rues de la carte sont réelles. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Menschen aus der Innenstadt tragen hier ein, was sie beobachten: Plätze, die sich stark aufheizen, Überflutungen nach Starkregen, Wartestellen ohne Schatten, versiegelte Flächen und vertrocknete Bäume. Die Bürgerwissenschafts-Gruppe Grüne Mitte prüft jeden Eintrag mit einer zweiten Beobachtung oder einer einfachen Messung und markiert ihn als bestätigt oder nicht bestätigt. Viele kleine Beobachtungen ergeben Straße für Straße ein Bild von Hitze und Wasser. Einmal im Jahr übergibt die Gruppe ihren Bericht an das Klimaanpassungsteam der Stadt.</p><p>Das sind Beobachtungen von Anwohnern, keine amtliche Bewertung.</p><p>Dies ist eine Demo. Die Gruppe Grüne Mitte und alle Einträge sind erfunden, die Straßen auf der Karte sind echt. Alles, was du einträgst, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the hot square and read how the group checked the observation with measurements. Then enter an observation from your own street.'
  es: 'Abre la plaza caliente y lee cómo el grupo comprobó la observación con mediciones. Después anota una observación de tu propia calle.'
  fr: 'Ouvrez la place brûlante et lisez comment le groupe a vérifié l''observation par des mesures. Saisissez ensuite une observation de votre propre rue.'
  de: 'Öffne den heißen Platz und lies, wie die Gruppe die Beobachtung mit Messungen geprüft hat. Trag dann selbst eine Beobachtung aus deiner Straße ein.'

reports:
  - key: hot-square
    category: heat
    lat: 51.681
    lng: 7.819
    address: { address_line1: 'Marktplatz', postal_code: '59065', locality: 'Hamm', country_code: DE }
    time: '15:20'
    photo:
      file: images/climate-watch-hot-square.jpg
      alt:
        en: 'A large square paved in light grey concrete slabs under a high afternoon sun, with empty metal benches in full sun and no tree or shade anywhere.'
        es: 'Una gran plaza pavimentada con losas de hormigón gris claro bajo el sol alto de la tarde, con bancos metálicos vacíos a pleno sol y sin ningún árbol ni sombra.'
        fr: 'Une grande place pavée de dalles de béton gris clair sous le soleil haut de l''après-midi, avec des bancs métalliques vides en plein soleil et aucun arbre ni aucune ombre.'
        de: 'Ein großer Platz aus hellgrauen Betonplatten unter hoher Nachmittagssonne, leere Metallbänke in praller Sonne, nirgends ein Baum oder Schatten.'
    title:
      en: 'Paved square gets very hot in the afternoon'
      es: 'La plaza pavimentada se calienta mucho por la tarde'
      fr: 'La place pavée devient brûlante l''après-midi'
      de: 'Gepflasterter Platz heizt sich nachmittags stark auf'
    description:
      en: 'In the afternoon there is no shade anywhere on the square. The paving is so hot that you can feel it through your shoes, and nobody sits on the benches.'
      es: 'Por la tarde no hay sombra en ninguna parte de la plaza. El suelo está tan caliente que se nota a través de los zapatos, y nadie se sienta en los bancos.'
      fr: 'L''après-midi, il n''y a d''ombre nulle part sur la place. Le sol est si chaud qu''on le sent à travers les chaussures, et personne ne s''assoit sur les bancs.'
      de: 'Nachmittags gibt es auf dem Platz nirgends Schatten. Das Pflaster ist so heiß, dass man es durch die Schuhe spürt, und auf den Bänken sitzt niemand.'
    history:
      - status: received
        days_ago: 52
        note:
          en: 'Thank you, we have received your entry.'
          es: 'Gracias, hemos recibido tu entrada.'
          fr: 'Merci, nous avons bien reçu votre saisie.'
          de: 'Danke, dein Eintrag ist eingegangen.'
      - status: under-review
        days_ago: 51
        time: '20:10'
        note:
          en: 'Thank you. We will check this with measurements: on the next hot afternoons two members will measure the surface temperature on the square and, for comparison, under the trees on the ring road nearby.'
          es: 'Gracias. Lo comprobaremos con mediciones: en las próximas tardes de calor dos miembros medirán la temperatura del suelo en la plaza y, para comparar, bajo los árboles de la ronda cercana.'
          fr: 'Merci. Nous allons vérifier par des mesures : lors des prochains après-midi chauds, deux membres mesureront la température du sol sur la place et, pour comparer, sous les arbres du boulevard voisin.'
          de: 'Danke. Wir prüfen das mit Messungen: An den nächsten heißen Nachmittagen messen zwei Mitglieder die Oberflächentemperatur auf dem Platz und zum Vergleich unter den Bäumen am nahen Ring.'
      - status: under-review
        days_ago: 47
        time: '19:45'
        note:
          en: 'First measurement at 3 pm: 51 °C on the paving in the sun, 29 °C on the lawn under the trees on the ring road. We will measure twice more to be sure.'
          es: 'Primera medición a las 15:00: 51 °C en el pavimento al sol, 29 °C en el césped bajo los árboles de la ronda. Mediremos dos veces más para estar seguros.'
          fr: 'Première mesure à 15 h : 51 °C sur les dalles au soleil, 29 °C sur la pelouse sous les arbres du boulevard. Nous mesurerons encore deux fois pour en être sûrs.'
          de: 'Erste Messung um 15 Uhr: 51 °C auf dem Pflaster in der Sonne, 29 °C auf dem Rasen unter den Bäumen am Ring. Wir messen noch zweimal, um sicher zu sein.'
      - status: confirmed
        days_ago: 41
        time: '20:30'
        note:
          en: 'Confirmed after three hot afternoons: the paving was always above 48 °C, about 20 degrees hotter than under the trees nearby. Two more people have entered the same observation. It goes into our yearly report on heat in the town centre for the city''s climate adaptation team.'
          es: 'Confirmado tras tres tardes de calor: el pavimento siempre superó los 48 °C, unos 20 grados más que bajo los árboles cercanos. Otras dos personas han anotado la misma observación. Entra en nuestro informe anual sobre el calor en el centro para el equipo de adaptación climática del ayuntamiento.'
          fr: 'Confirmé après trois après-midi chauds : les dalles dépassaient toujours 48 °C, environ 20 degrés de plus que sous les arbres voisins. Deux autres personnes ont saisi la même observation. Elle figurera dans notre rapport annuel sur la chaleur au centre-ville, destiné à l''équipe d''adaptation climatique de la ville.'
          de: 'Bestätigt nach drei heißen Nachmittagen: Das Pflaster hatte immer über 48 °C, etwa 20 Grad mehr als unter den Bäumen in der Nähe. Zwei weitere Personen haben dieselbe Beobachtung eingetragen. Sie kommt in unseren Jahresbericht zur Hitze in der Innenstadt für das Klimaanpassungsteam der Stadt.'

  - key: flooded-corner
