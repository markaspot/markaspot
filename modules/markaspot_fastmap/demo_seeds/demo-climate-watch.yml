        es: 'Una esquina después de una lluvia fuerte: el agua marrón cubre la calzada y el bordillo rebajado, y se arremolina sobre un sumidero desbordado.'
        fr: 'Un coin de rue après une forte pluie : l''eau brune recouvre la chaussée et la bordure abaissée, et tourbillonne au-dessus d''une bouche d''égout débordée.'
        de: 'Eine Straßenecke nach Starkregen: Braunes Wasser bedeckt Fahrbahn und abgesenkten Bordstein, über einem überlasteten Gully wirbelt das Wasser.'
    title:
