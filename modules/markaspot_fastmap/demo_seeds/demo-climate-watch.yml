          de: 'Nicht als Trockenschaden bestätigt. Die braunen Blätter kommen von der Kastanienminiermotte, deren Larven die Blätter von innen fressen, nicht von der Trockenheit. Der Eintrag bleibt mit dieser Antwort auf der Karte, aber nicht auf unserer Trockenheitsliste.'

