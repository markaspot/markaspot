# Template demo: neighbourhood ("Neighbourhood ideas map", DE "Quartiers-Ideenkarte").
# Format: README.md of the demo seeds. Real geometry, fictional names: the
# pins lie in a real residential quarter (Münster, Kreuzviertel), the
# "Erlenviertel", the association, the people and all ideas are fictional.
# No addresses are given on purpose: the geocoder fills the real address of
# each pin, so the address never contradicts the map tiles.
# Story: a residents' association runs the map on its own. It reads every
# suggestion, discusses it at its monthly meeting, does small things with the
# neighbours and passes bigger ideas to the city's district office as a joint
# suggestion. The city makes no promise and never answers here.
# Times: residents submit in the evening, the association answers after its
# Tuesday meetings; entries without a time get a stable derived one.
# The statuses mirror the neighbourhood set in
# WorkspaceProvisioningService::STATUS_TEMPLATES exactly (keys, names,
# mappings). "taken-up" is closed there today, so it is the end state of
# ideas that were carried out. The planned closed status "implemented"
# ("Umgesetzt") does not exist yet; see README.
version: 1
slug: demo-neighbourhood
template: neighbourhood
seed_version: 3
default_language: en
languages: [en, es, fr, de]
wording: suggestion
ai_system_prompt: >-
  Purpose: an ideas map for a neighbourhood. Residents suggest what could be improved at a
  specific place; the idea itself is usually not visible yet. Valid photos: the place an idea
  relates to, such as a square, a street corner, a courtyard, a tree pit, an empty lot, a bench or
  a wall. Exclusions: documents, screenshots, sketches of unrelated places, people as the main
  subject. Describe the place neutrally and add one short hint at what could be suggested there;
  do not describe it as damaged unless damage is clearly visible.
name: 'Erlenviertel Ideas Map'
claim:
  en: 'Share ideas for the neighbourhood'
  es: 'Compartir ideas para el barrio'
  fr: 'Partager des idées pour le quartier'
  de: 'Ideen fürs Viertel teilen'
map:
  lat: 51.9699
  lng: 7.6208
  zoom: 16
boundary:
  radius_km: 0.6
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: submitted
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-plus
    name: { en: 'Submitted', es: 'Enviado', fr: 'Soumis', de: 'Eingereicht' }
  - key: in-discussion
    mapping: open
    hex: '#2563EB'
    icon: i-lucide-messages-square
    name: { en: 'In discussion', es: 'En debate', fr: 'En discussion', de: 'In Diskussion' }
  - key: taken-up
    mapping: closed
    hex: '#059669'
    icon: i-lucide-check
    name: { en: 'Taken up', es: 'Aceptado', fr: 'Retenu', de: 'Aufgegriffen' }
  - key: not-pursued
    mapping: closed
    hex: '#64748B'
    icon: i-lucide-circle-x
    name: { en: 'Not pursued', es: 'Descartado', fr: 'Non retenu', de: 'Nicht weiterverfolgt' }

# Names and icons follow the neighbourhood template (template-registry.ts,
# useTemplates.ts categoryIcons), in the same order.
categories:
  - key: meeting-place
    icon: i-lucide-users
    name: { en: 'Playground and meeting place', es: 'Parque infantil y punto de encuentro', fr: 'Aire de jeux et lieu de rencontre', de: 'Spielplatz und Treffpunkt' }
  - key: green
    icon: i-lucide-trees
    name: { en: 'Green and trees', es: 'Zonas verdes y árboles', fr: 'Verdure et arbres', de: 'Grün und Bäume' }
  - key: traffic
    icon: i-lucide-traffic-cone
    name: { en: 'Calmer traffic', es: 'Tráfico calmado', fr: 'Circulation apaisée', de: 'Ruhigerer Verkehr' }
  - key: seating
    icon: i-lucide-armchair
    name: { en: 'Seating', es: 'Bancos y asientos', fr: 'Bancs et assises', de: 'Sitzplätze' }
  - key: culture
    icon: i-lucide-music
    name: { en: 'Culture and festivals', es: 'Cultura y fiestas', fr: 'Culture et fêtes', de: 'Kultur und Feste' }
  - key: other
    icon: i-lucide-lightbulb
    name: { en: 'Other idea', es: 'Otra idea', fr: 'Autre idée', de: 'Andere Idee' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature. The city appears only in the notes, as the recipient of what the
# association passes on.
organisations: []

start_page:
  title:
    en: 'Welcome to the Erlenviertel ideas map'
    es: 'Bienvenido al mapa de ideas del Erlenviertel'
    fr: 'Bienvenue sur la carte d''idées de l''Erlenviertel'
    de: 'Willkommen bei der Ideenkarte fürs Erlenviertel'
  body:
    en: '<p>Residents of the Erlenviertel collect ideas for their quarter here: places to meet, more green, calmer streets, benches, culture and festivals. The neighbourhood association reads every suggestion, discusses it at its monthly meeting and answers right here on the map. Small things the neighbours do themselves. Bigger ideas go to the city''s district office as a joint suggestion.</p><p>This map is for ideas, not for complaints about neighbours. The association reads every suggestion and takes it off the map if it does not belong here.</p><p>This is a demo. The Erlenviertel, the association and all suggestions are fictional; the streets on the map are real. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Los vecinos del Erlenviertel reúnen aquí ideas para su barrio: lugares de encuentro, más verde, calles más tranquilas, bancos, cultura y fiestas. La asociación de vecinos lee cada sugerencia, la debate en su reunión mensual y responde directamente en el mapa. Las cosas pequeñas las hacen los propios vecinos. Las ideas más grandes llegan a la oficina de distrito del ayuntamiento como propuesta conjunta.</p><p>Este mapa es para ideas, no para quejas sobre los vecinos. La asociación lee cada sugerencia y la retira del mapa si no corresponde aquí.</p><p>Esto es una demostración. El Erlenviertel, la asociación y todas las sugerencias son ficticios; las calles del mapa son reales. Todo lo que añadas se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Les habitants de l''Erlenviertel rassemblent ici des idées pour leur quartier : lieux de rencontre, plus de verdure, rues plus calmes, bancs, culture et fêtes. L''association de quartier lit chaque proposition, en discute lors de sa réunion mensuelle et répond directement sur la carte. Les petites choses, les voisins les font eux-mêmes. Les idées plus importantes sont transmises au bureau de quartier de la ville sous forme de proposition commune.</p><p>Cette carte sert aux idées, pas aux plaintes contre les voisins. L''association lit chaque proposition et la retire de la carte si elle n''a pas sa place ici.</p><p>Ceci est une démo. L''Erlenviertel, l''association et toutes les propositions sont fictifs ; les rues de la carte sont réelles. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Die Menschen im Erlenviertel sammeln hier Ideen für ihr Quartier: Treffpunkte, mehr Grün, ruhigere Straßen, Bänke, Kultur und Feste. Der Nachbarschaftsverein liest jeden Vorschlag, bespricht ihn beim monatlichen Treffen und antwortet direkt auf der Karte. Kleine Dinge setzen die Nachbarn selbst um. Größere Ideen gehen als gemeinsamer Vorschlag an das Stadtteilbüro der Stadt.</p><p>Diese Karte ist für Ideen da, nicht für Beschwerden über Nachbarn. Der Verein liest jeden Vorschlag und nimmt ihn von der Karte, wenn er nicht hierher gehört.</p><p>Dies ist eine Demo. Das Erlenviertel, der Verein und alle Vorschläge sind erfunden, die Straßen auf der Karte sind echt. Alles, was du einträgst, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the courtyard flea market and read how the neighbourhood association took up the idea. Then suggest something for your own quarter.'
  es: 'Abre el mercadillo en los patios y lee cómo la asociación de vecinos hizo suya la idea. Después propón algo para tu propio barrio.'
  fr: 'Ouvrez le vide-greniers dans les cours et lisez comment l''association de quartier a repris l''idée. Proposez ensuite quelque chose pour votre propre quartier.'
  de: 'Öffne den Hofflohmarkt und lies, wie der Nachbarschaftsverein die Idee aufgegriffen hat. Schlag dann selbst etwas für dein Viertel vor.'

reports:
  - key: courtyard-market
    category: culture
    lat: 51.9706
    lng: 7.6198
    address: { address_line1: 'Finkenstraße', postal_code: '48147', locality: 'Münster', country_code: DE }
    time: '19:20'
    photo:
      file: images/neighbourhood-courtyard-market.jpg
      alt:
        en: 'A backyard behind a brick house with folding tables full of second-hand things, crockery, toys and folded clothes, bunting above and autumn leaves on the ground.'
        es: 'Un patio trasero detrás de una casa de ladrillo con mesas plegables llenas de objetos de segunda mano, vajilla, juguetes y ropa doblada, banderines encima y hojas de otoño en el suelo.'
        fr: 'Une cour derrière une maison en brique avec des tables pliantes couvertes d''objets d''occasion, vaisselle, jouets et vêtements pliés, des fanions au-dessus et des feuilles mortes au sol.'
        de: 'Ein Hinterhof hinter einem Backsteinhaus mit Klapptischen voller gebrauchter Sachen, Geschirr, Spielzeug und gefalteter Kleidung, darüber Wimpel, am Boden Herbstlaub.'
    title:
      en: 'A courtyard flea market for the whole quarter'
      es: 'Un mercadillo en los patios de todo el barrio'
      fr: 'Un vide-greniers dans les cours de tout le quartier'
      de: 'Hofflohmarkt fürs ganze Viertel'
    description:
      en: 'Many of us keep things in the cellar that others could use. How about one Sunday when every household that wants to sells from its own courtyard or front garden? You walk from yard to yard and get to know the neighbours.'
      es: 'Muchos guardamos en el sótano cosas que otros podrían usar. ¿Qué tal un domingo en el que cada hogar que quiera venda desde su propio patio o jardín delantero? Se va de patio en patio y se conoce a los vecinos.'
      fr: 'Beaucoup d''entre nous gardent à la cave des choses qui pourraient servir à d''autres. Pourquoi pas un dimanche où chaque foyer qui le souhaite vend depuis sa propre cour ou son jardin de devant ? On passe de cour en cour et on fait connaissance avec les voisins.'
      de: 'Viele von uns haben Sachen im Keller, die andere noch brauchen könnten. Wie wäre ein Sonntag, an dem jeder Haushalt, der mag, aus dem eigenen Hof oder Vorgarten verkauft? Man geht von Hof zu Hof und lernt die Nachbarn kennen.'
    history:
      - status: submitted
        days_ago: 34
        note:
          en: 'Thank you, we have received your suggestion.'
          es: 'Gracias, hemos recibido tu sugerencia.'
          fr: 'Merci, nous avons bien reçu votre proposition.'
          de: 'Danke, dein Vorschlag ist eingegangen.'
      - status: in-discussion
        days_ago: 31
        time: '21:15'
        note:
          en: 'Thank you for the idea. We will discuss it at the next neighbourhood meeting on Tuesday. Would you take part with your own courtyard?'
          es: 'Gracias por la idea. La debatiremos en la próxima reunión de vecinos del martes. ¿Participarías con tu propio patio?'
          fr: 'Merci pour cette idée. Nous en discuterons lors de la prochaine réunion de quartier, mardi. Participeriez-vous avec votre propre cour ?'
          de: 'Danke für die Idee. Wir besprechen sie beim nächsten Nachbarschaftstreffen am Dienstag. Würdest du mit deinem eigenen Hof mitmachen?'
      - status: in-discussion
        days_ago: 24
        time: '21:40'
        note:
          en: 'At the meeting 14 households signed up straight away. We have picked a Sunday, and two neighbours are drawing a small map of all courtyards that take part. Everything happens in the courtyards and front gardens.'
          es: 'En la reunión se apuntaron enseguida 14 hogares. Hemos elegido un domingo y dos vecinas dibujan un pequeño plano con todos los patios que participan. Todo se hace en los patios y jardines delanteros.'
          fr: 'Lors de la réunion, 14 foyers se sont inscrits tout de suite. Nous avons choisi un dimanche, et deux voisines dessinent un petit plan de toutes les cours participantes. Tout se passe dans les cours et les jardins de devant.'
          de: 'Beim Treffen haben sich sofort 14 Haushalte eingetragen. Wir haben einen Sonntag festgelegt, und zwei Nachbarinnen zeichnen einen kleinen Plan mit allen Höfen, die mitmachen. Alles findet in den Höfen und Vorgärten statt.'
      - status: taken-up
        days_ago: 6
        time: '20:05'
        note:
          en: 'The first courtyard flea market took place last Sunday, with 23 courtyards. Thank you to everyone who joined in. We will do it again in spring and keep the list of courtyards.'
          es: 'El primer mercadillo en los patios se celebró el domingo pasado, con 23 patios. Gracias a todos los que participaron. Lo repetiremos en primavera y guardamos la lista de patios.'
          fr: 'Le premier vide-greniers dans les cours a eu lieu dimanche dernier, avec 23 cours. Merci à toutes celles et ceux qui ont participé. Nous recommencerons au printemps et gardons la liste des cours.'
          de: 'Der erste Hofflohmarkt war am vergangenen Sonntag, mit 23 Höfen. Danke an alle, die mitgemacht haben. Im Frühjahr machen wir das wieder und behalten die Liste der Höfe.'

