# Template demo: issue-reporter ("Issue reporter", DE "Mängelmelder").
# Format: README.md of the demo seeds. The only template demo run by an
# administration. Real geometry, fictional names: the pins lie in a real
# residential district of Amsterdam (Oud-West), placed with OpenStreetMap
# data at real playgrounds, benches and small parks. "Gemeente Waterhoven",
# its teams, the people and all reports are fictional: no real municipality,
# department or branding. The slug stays demo-amsterdam (template-demos.ts).
# No addresses are given on purpose: the geocoder fills them.
# Story: residents report, the municipality's public space team reads every
# report, passes it to the responsible crew and posts the status publicly.
# The notes describe what happened, never a deadline.
# Times: residents report on their way to work or in the evening, the city
# answers during office hours; entries without a time get a stable derived
# one.
# The statuses mirror DEFAULT_STATUSES in WorkspaceProvisioningService
# exactly (names, hex, icons, mappings), which issue-reporter gets because it
# has no STATUS_TEMPLATES entry. DEFAULT_STATUSES has no keys; the keys here
# are the seed's own.
version: 1
slug: demo-amsterdam
template: issue-reporter
seed_version: 2
default_language: en
languages: [en, es, fr, de]
wording: report
name: 'Gemeente Waterhoven'
claim:
  en: 'Report local issues'
  es: 'Comunicar problemas del entorno'
  fr: 'Signaler les problèmes locaux'
  de: 'Mängel vor Ort melden'
map:
  lat: 52.3652
  lng: 4.8655
  zoom: 16
boundary:
  radius_km: 0.6
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: created
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-plus
    name: { en: 'Created', es: 'Creado', fr: 'Créé', de: 'Erstellt' }
  - key: in-progress
    mapping: open
    hex: '#2563EB'
    icon: i-lucide-clock
    name: { en: 'In progress', es: 'En curso', fr: 'En cours', de: 'In Bearbeitung' }
  - key: done
    mapping: closed
    hex: '#059669'
    icon: i-lucide-check
    name: { en: 'Done', es: 'Hecho', fr: 'Terminé', de: 'Erledigt' }

# Names and icons follow the issue-reporter template (template-registry.ts,
# useTemplates.ts categoryIcons), in the same order.
categories:
  - key: road-damage
    icon: i-lucide-road
    name: { en: 'Road damage', es: 'Daño vial', fr: 'Dégât routier', de: 'Straßenschaden' }
  - key: streetlight
    icon: i-lucide-lightbulb
    name: { en: 'Streetlight', es: 'Alumbrado', fr: 'Éclairage public', de: 'Straßenbeleuchtung' }
  - key: green-space
    icon: i-lucide-trees
    name: { en: 'Green space', es: 'Zona verde', fr: 'Espace vert', de: 'Grünfläche' }
  - key: cleanliness
    icon: i-lucide-trash-2
    name: { en: 'Cleanliness', es: 'Limpieza', fr: 'Propreté', de: 'Sauberkeit' }
  - key: playground
    icon: i-lucide-ferris-wheel
    name: { en: 'Playground', es: 'Parque infantil', fr: 'Aire de jeux', de: 'Spielplatz' }
  - key: vandalism
    icon: i-lucide-spray-can
    name: { en: 'Vandalism', es: 'Vandalismo', fr: 'Vandalisme', de: 'Vandalismus' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature. The crews appear only in the notes.
organisations: []

start_page:
  title:
    en: 'Welcome to the issue reporter of Gemeente Waterhoven'
    es: 'Bienvenido al buzón de incidencias de Gemeente Waterhoven'
    fr: 'Bienvenue sur le service de signalement de Gemeente Waterhoven'
    de: 'Willkommen beim Mängelmelder der Gemeente Waterhoven'
  body:
    en: '<p>Report potholes, broken street lights, dumped waste, graffiti or a broken bench in the district here. The public space team of the municipality reads every report, passes it to the crew that is responsible and shows the status on the map for everyone: Created, In progress, Done.</p><p>This is a demo. Gemeente Waterhoven is a fictional municipality on a real map: the streets are real, the municipality, its teams and all reports are fictional. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Aquí puedes comunicar baches, farolas averiadas, basura abandonada, grafitis o un banco roto en el barrio. El equipo de espacio público del municipio lee cada aviso, lo pasa al equipo responsable y muestra el estado en el mapa para todos: Creado, En curso, Hecho.</p><p>Esto es una demostración. Gemeente Waterhoven es un municipio ficticio sobre un mapa real: las calles son reales, el municipio, sus equipos y todos los avisos son ficticios. Todo lo que añadas se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Signalez ici les nids-de-poule, les lampadaires en panne, les dépôts sauvages, les graffitis ou un banc cassé dans le quartier. L''équipe espace public de la commune lit chaque signalement, le transmet à l''équipe responsable et affiche le statut sur la carte pour tout le monde : Créé, En cours, Terminé.</p><p>Ceci est une démo. Gemeente Waterhoven est une commune fictive sur une carte réelle : les rues sont réelles, la commune, ses équipes et tous les signalements sont fictifs. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Melde hier Schlaglöcher, kaputte Straßenlaternen, abgestellten Müll, Graffiti oder eine kaputte Bank im Viertel. Das Team öffentlicher Raum der Gemeinde liest jede Meldung, gibt sie an die zuständige Kolonne weiter und zeigt den Status für alle auf der Karte: Erstellt, In Bearbeitung, Erledigt.</p><p>Dies ist eine Demo. Die Gemeente Waterhoven ist eine erfundene Gemeinde auf einer echten Karte: Die Straßen sind echt, die Gemeinde, ihre Teams und alle Meldungen sind erfunden. Alles, was du einträgst, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the hole in the brick paving and read how the municipality followed it up until it was repaired. Then report something in your own street.'
  es: 'Abre el agujero en el pavimento de ladrillo y lee cómo el municipio lo siguió hasta repararlo. Después comunica algo de tu propia calle.'
  fr: 'Ouvrez le trou dans le pavage en briques et lisez comment la commune l''a suivi jusqu''à la réparation. Signalez ensuite quelque chose dans votre propre rue.'
  de: 'Öffne das Loch im Klinkerpflaster und lies, wie die Gemeinde es bis zur Reparatur verfolgt hat. Melde dann etwas aus deiner eigenen Straße.'

reports:
  - key: sunken-bricks
    category: road-damage
    lat: 52.36465
    lng: 4.8667
    address: { address_line1: 'Jacob van Lennepstraat', postal_code: '1053', locality: 'Amsterdam', country_code: NL }
    time: '08:10'
    photo:
      file: images/issue-reporter-pothole.jpg
      alt:
        en: 'A hole in a red brick-paved street where several bricks have sunk and broken away, with loose bricks, a puddle and an orange traffic cone next to it.'
        es: 'Un agujero en una calle de ladrillo rojo donde varios ladrillos se han hundido y roto, con ladrillos sueltos, un charco y un cono naranja al lado.'
        fr: 'Un trou dans une rue pavée de briques rouges où plusieurs briques se sont affaissées et cassées, avec des briques détachées, une flaque et un cône orange à côté.'
        de: 'Ein Loch in einer roten Klinkerstraße, mehrere Steine sind abgesackt und ausgebrochen, lose Steine, eine Pfütze und daneben ein orangefarbener Leitkegel.'
    title:
      en: 'Hole in the brick paving'
      es: 'Agujero en el pavimento de ladrillo'
      fr: 'Trou dans le pavage en briques'
      de: 'Loch im Klinkerpflaster'
    description:
      en: 'Several bricks have sunk and broken out of the road. The hole is right where the bikes ride, and in the dark you only see it at the last moment.'
      es: 'Varios ladrillos se han hundido y se han soltado de la calzada. El agujero está justo por donde pasan las bicis y de noche solo se ve en el último momento.'
      fr: 'Plusieurs briques se sont affaissées et détachées de la chaussée. Le trou se trouve juste là où passent les vélos, et la nuit on ne le voit qu''au dernier moment.'
      de: 'Mehrere Klinker sind abgesackt und aus der Fahrbahn gebrochen. Das Loch liegt genau da, wo die Räder fahren, und im Dunkeln sieht man es erst im letzten Moment.'
    history:
      - status: created
        days_ago: 9
        note:
          en: 'Thank you for your report. We have received it.'
          es: 'Gracias por tu aviso. Lo hemos recibido.'
          fr: 'Merci pour votre signalement. Nous l''avons bien reçu.'
          de: 'Danke für deine Meldung. Wir haben sie erhalten.'
      - status: in-progress
        days_ago: 8
        time: '10:30'
        note:
          en: 'The public space team has checked the spot: the hole is about 40 cm wide. We have put a cone next to it and passed the repair to the paving crew.'
          es: 'El equipo de espacio público ha revisado el lugar: el agujero mide unos 40 cm. Hemos puesto un cono al lado y hemos pasado la reparación al equipo de pavimentación.'
          fr: 'L''équipe espace public a contrôlé l''endroit : le trou fait environ 40 cm de large. Nous avons placé un cône à côté et confié la réparation à l''équipe de voirie.'
          de: 'Das Team öffentlicher Raum hat sich die Stelle angesehen: Das Loch ist etwa 40 cm breit. Wir haben einen Leitkegel daneben gestellt und die Reparatur an die Pflasterkolonne gegeben.'
      - status: in-progress
        days_ago: 5
        time: '14:15'
        note:
          en: 'The paving crew has taken out the loose bricks. The sand underneath had washed away, so they are filling and compacting it first.'
          es: 'El equipo de pavimentación ha retirado los ladrillos sueltos. La arena de debajo se había ido con el agua, así que primero la están rellenando y compactando.'
          fr: 'L''équipe de voirie a retiré les briques détachées. Le sable en dessous avait été emporté par l''eau : elle le remplace et le compacte d''abord.'
          de: 'Die Pflasterkolonne hat die losen Klinker herausgenommen. Der Sand darunter war ausgespült, deshalb wird er zuerst aufgefüllt und verdichtet.'
      - status: done
        days_ago: 3
        time: '16:40'
        note:
          en: 'The bricks have been relaid and the cone has been removed. Thank you for your report.'
          es: 'Los ladrillos se han vuelto a colocar y se ha retirado el cono. Gracias por tu aviso.'
          fr: 'Les briques ont été reposées et le cône a été retiré. Merci pour votre signalement.'
          de: 'Die Klinker sind neu verlegt, der Leitkegel ist weg. Danke für deine Meldung.'

