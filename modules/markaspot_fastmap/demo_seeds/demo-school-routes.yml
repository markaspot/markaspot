# Template demo: safe-routes ("School route map", DE "Schulwegkarte").
# Format: README.md in this directory. The area is a placeholder until the
# demo areas are decided; the school, the people and all incidents are
# fictional. No addresses are given on purpose: the geocoder fills the real
# address of each pin, so the address never contradicts the map tiles.
# Story: a parents' initiative runs the map on its own. It sorts the reports,
# asks back, solves what it can and takes the rest to the school and the city.
# Times: parents report on the way to school in the morning, the initiative
# answers in the evening; entries without a time get a stable derived one.
# The statuses mirror the safe-routes set in
# WorkspaceProvisioningService::STATUS_TEMPLATES exactly (keys, names,
# mappings), so the demo shows the workflow a real workspace gets.
version: 1
slug: demo-school-routes
template: safe-routes
seed_version: 5
default_language: en
languages: [en, es, fr, de]
wording: report
name: 'Lindenhof School Routes'
claim:
  en: 'Report dangerous spots on the way to school'
  es: 'Señale los puntos peligrosos del camino al colegio'
  fr: 'Signalez les endroits dangereux sur le chemin de l''école'
  de: 'Gefahrenstellen auf dem Schulweg melden'
map:
  lat: 50.8296
  lng: 6.9047
  zoom: 16
boundary:
  radius_km: 0.8
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: received
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-plus
    name: { en: 'Received', es: 'Recibido', fr: 'Reçu', de: 'Eingegangen' }
  - key: question
    mapping: open
    hex: '#7C3AED'
    icon: i-lucide-message-circle-question
    name: { en: 'Question to reporter', es: 'Consulta al remitente', fr: 'Question à l''auteur', de: 'Rückfrage' }
  - key: in-progress
    mapping: open
    hex: '#2563EB'
    icon: i-lucide-clock
    name: { en: 'In progress', es: 'En curso', fr: 'En cours', de: 'In Bearbeitung' }
  - key: handed-over
    mapping: open
    hex: '#0891B2'
    icon: i-lucide-send
    name: { en: 'Handed over to school or city', es: 'Entregado al colegio o al ayuntamiento', fr: 'Transmis à l''école ou à la ville', de: 'An Schule oder Stadt übergeben' }
  - key: resolved
    mapping: closed
    hex: '#059669'
    icon: i-lucide-check
    name: { en: 'Resolved', es: 'Resuelto', fr: 'Résolu', de: 'Erledigt' }

categories:
  - key: crossing
    icon: i-lucide-traffic-cone
    name: { en: 'Dangerous crossing', es: 'Cruce peligroso', fr: 'Traversée dangereuse', de: 'Gefährliche Querung' }
  - key: sidewalk
    icon: i-lucide-footprints
    name: { en: 'Missing or blocked sidewalk', es: 'Acera inexistente o bloqueada', fr: 'Trottoir absent ou encombré', de: 'Fehlender oder zugestellter Gehweg' }
  - key: visibility
    icon: i-lucide-eye-off
    name: { en: 'Poor visibility', es: 'Mala visibilidad', fr: 'Mauvaise visibilité', de: 'Schlechte Sicht' }
  - key: speed
    icon: i-lucide-gauge
    name: { en: 'Speeding', es: 'Exceso de velocidad', fr: 'Vitesse excessive', de: 'Zu schnelles Fahren' }
  - key: lighting
    icon: i-lucide-lightbulb
    name: { en: 'Dark spot', es: 'Zona oscura', fr: 'Zone mal éclairée', de: 'Dunkle Stelle' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature. The city appears only in the notes, as the recipient of what the
# parents hand over.
organisations: []

start_page:
  title:
    en: 'Welcome to the school route map'
    es: 'Bienvenido al mapa de caminos escolares'
    fr: 'Bienvenue sur la carte des trajets scolaires'
    de: 'Willkommen bei der Schulwegkarte'
  body:
    en: '<p>Parents, children and neighbours collect dangerous spots on the way to Lindenhof Primary School. The parents'' initiative reads every report, asks back when something is unclear and answers right here on the map. What parents cannot fix themselves, they take to the school and the city.</p><p>This is a demo. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Familias, niños y vecinos reúnen aquí los puntos peligrosos del camino a la escuela primaria Lindenhof. La iniciativa de madres y padres lee cada aviso, pregunta cuando algo no está claro y responde directamente en el mapa. Lo que las familias no pueden resolver por sí mismas lo llevan a la escuela y al ayuntamiento.</p><p>Esto es una demostración. Todo lo que añada se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Parents, enfants et riverains recensent ici les endroits dangereux sur le chemin de l''école primaire Lindenhof. L''initiative de parents lit chaque signalement, pose des questions quand quelque chose n''est pas clair et répond directement sur la carte. Ce que les parents ne peuvent pas régler eux-mêmes, ils le portent à l''école et à la ville.</p><p>Ceci est une démo. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Eltern, Kinder und Nachbarn sammeln hier Gefahrenstellen auf dem Weg zur Grundschule Lindenhof. Die Elterninitiative liest jede Meldung, fragt nach, wenn etwas unklar ist, und antwortet direkt auf der Karte. Was Eltern nicht selbst lösen können, bringen sie zur Schule und zur Stadt.</p><p>Dies ist eine Demo. Alles, was Sie eintragen, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the dangerous crossing and read how the parents'' initiative followed up. Then report another spot on your way to school.'
  es: 'Abra el cruce peligroso y lea cómo respondió la iniciativa de madres y padres. Después señale otro punto de su camino al colegio.'
  fr: 'Ouvrez la traversée dangereuse et lisez la réponse de l''initiative de parents. Signalez ensuite un autre endroit sur le chemin de l''école.'
  de: 'Öffnen Sie die gefährliche Querung und lesen Sie, wie die Elterninitiative reagiert hat. Melden Sie dann eine weitere Stelle auf dem Schulweg.'

reports:
  - key: dangerous-crossing
    category: crossing
    lat: 50.8301
    lng: 6.9052
    time: '07:52'
    photo:
      file: images/school-routes-crossing.jpg
      alt:
        en: 'A child with a school backpack walks between two parked cars towards the school gate.'
        es: 'Un escolar con mochila camina entre dos coches aparcados hacia la verja del colegio.'
        fr: 'Un enfant avec un cartable marche entre deux voitures garées vers la grille de l''école.'
        de: 'Ein Kind mit Schulranzen geht zwischen zwei parkenden Autos auf das Schultor zu.'
    title:
      en: 'Children cross between parked cars'
      es: 'Los niños cruzan entre coches aparcados'
      fr: 'Les enfants traversent entre des voitures garées'
      de: 'Kinder queren zwischen parkenden Autos'
    description:
      en: 'There is no crossing near the school gate. In the morning the children squeeze between parked cars to get to the other side, and drivers cannot see them.'
      es: 'No hay paso de peatones cerca de la puerta del colegio. Por la mañana los niños pasan entre coches aparcados para cruzar y los conductores no los ven.'
      fr: 'Il n''y a pas de passage piéton près de l''entrée de l''école. Le matin, les enfants se faufilent entre les voitures garées pour traverser et les conducteurs ne les voient pas.'
      de: 'In der Nähe des Schultors gibt es keinen Überweg. Morgens zwängen sich die Kinder zwischen parkenden Autos hindurch, und die Autofahrer sehen sie nicht.'
    history:
      - status: received
        days_ago: 21
        note:
          en: 'Thank you, we have received your report.'
          es: 'Gracias, hemos recibido su aviso.'
          fr: 'Merci, nous avons bien reçu votre signalement.'
          de: 'Vielen Dank, Ihre Meldung ist eingegangen.'
      - status: question
        days_ago: 19
        time: '20:40'
        note:
          en: 'Thank you for the report. Does this happen mainly before school starts, or also in the afternoon?'
          es: 'Gracias por el aviso. ¿Ocurre sobre todo antes de que empiecen las clases o también por la tarde?'
          fr: 'Merci pour ce signalement. Cela se produit-il surtout avant le début des cours ou aussi l''après-midi ?'
          de: 'Danke für die Meldung. Passiert das vor allem vor Schulbeginn oder auch am Nachmittag?'
      - status: in-progress
        days_ago: 15
        time: '21:10'
        note:
          en: 'Thanks for your answer: it happens mostly between 7:40 and 8:00. Parents will count the cars on two mornings so that we can show the city real numbers.'
          es: 'Gracias por su respuesta: pasa sobre todo entre las 7:40 y las 8:00. Algunas familias contarán los coches durante dos mañanas para poder enseñar al ayuntamiento cifras reales.'
          fr: 'Merci pour votre réponse : cela arrive surtout entre 7 h 40 et 8 h. Des parents vont compter les voitures pendant deux matins, pour montrer à la ville des chiffres réels.'
          de: 'Danke für die Antwort: Es passiert vor allem zwischen 7:40 und 8:00 Uhr. Eltern zählen an zwei Morgen die Autos, damit wir der Stadt echte Zahlen zeigen können.'
      - status: handed-over
        days_ago: 12
        time: '19:45'
        note:
          en: 'Parents counted the cars on two mornings. We have sent the numbers to the city and asked for a crossing guard. Until then, parents take turns at the gate.'
          es: 'Algunas familias contaron los coches durante dos mañanas. Hemos enviado las cifras al ayuntamiento y pedido un vigilante de cruce. Mientras tanto, madres y padres se turnan en la puerta.'
          fr: 'Des parents ont compté les voitures pendant deux matins. Nous avons envoyé les chiffres à la ville et demandé un agent de traversée. En attendant, des parents se relaient devant l''entrée.'
          de: 'Eltern haben an zwei Morgen die Autos gezählt. Wir haben die Zahlen an die Stadt geschickt und einen Schülerlotsen beantragt. Bis dahin stehen Eltern abwechselnd am Tor.'

