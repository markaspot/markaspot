          fr: 'Fin d''alerte : l''arbre a été découpé et déplacé sur le bord de la rue. La voie d''accès est de nouveau ouverte.'
          de: 'Entwarnung: Der Baum ist zersägt und an den Straßenrand geräumt. Die Zufahrt ist wieder frei.'

