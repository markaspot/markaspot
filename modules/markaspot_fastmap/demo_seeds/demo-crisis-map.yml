# Template demo: crisis-map ("Crisis map", DE "Krisenkarte").
# Format: README.md of the demo seeds. A FICTIONAL EXERCISE SCENARIO: the
# cleanup phase after a night of storm and heavy rain. Real geometry,
# fictional names: the pins lie in the real town of Wermelskirchen
# (Bergisches Land, no known flood disaster), placed with OpenStreetMap data
# at a real cycle path underpass, parks and residential streets. The storm
# night, the "Helferkreis Lindbach", the people and all reports are
# fictional. No real authority, fire brigade or relief organisation is named.
# No injured people, no people in need, no business as a cause of damage.
# No addresses are given on purpose: the geocoder fills them.
# Story: residents report what they see, a volunteer helper circle checks
# each report with a second person or a photo and marks it confirmed, all
# clear or not confirmed (one false report shows the verification).
# Times: the storm night starts two days before the seed run around 22:00,
# reports come in through the night, the cleanup runs the next day.
# The statuses mirror the crisis-map set in
# WorkspaceProvisioningService::STATUS_TEMPLATES exactly (keys, names,
# mappings).
version: 1
slug: demo-crisis-map
template: crisis-map
seed_version: 3
default_language: en
languages: [en, es, fr, de]
wording: report
ai_system_prompt: >-
  Purpose: a crisis map run by a volunteer helper group after a storm, flood, fire, earthquake or
  similar event. Residents document local impacts and where help is available. Valid observations:
  flooded streets and basements, fire or smoke, damaged buildings, power outages, blocked roads,
  debris and fallen trees, drop-in points where help or supplies are offered. Exclusions: rumours,
  news screenshots, injured people as the main subject, anything not related to the event. Flag a
  hazard only when it is acute and visible.
name: 'Helferkreis Lindbach Storm Map'
claim:
  en: 'Document local crisis impacts'
  es: 'Documentar efectos de las crisis'
  fr: 'Documenter les effets des crises'
  de: 'Krisenfolgen vor Ort dokumentieren'
map:
  lat: 51.1405
  lng: 7.2165
  zoom: 15
boundary:
  radius_km: 1.0
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: unconfirmed
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-dashed
    name: { en: 'Unconfirmed', es: 'Sin confirmar', fr: 'En attente de confirmation', de: 'Unbestätigt' }
  - key: confirmed
    mapping: open
    hex: '#DC2626'
    icon: i-lucide-triangle-alert
    name: { en: 'Confirmed', es: 'Confirmado', fr: 'Confirmé', de: 'Bestätigt' }
  - key: all-clear
    mapping: closed
    hex: '#059669'
    icon: i-lucide-shield-check
    name: { en: 'All clear', es: 'Fin de la alerta', fr: 'Fin d''alerte', de: 'Entwarnung' }
  - key: not-confirmed
    mapping: closed
    hex: '#64748B'
    icon: i-lucide-circle-x
    name: { en: 'Not confirmed', es: 'No confirmado', fr: 'Non confirmé', de: 'Nicht bestätigt' }

# Names and icons follow the crisis-map template after the rethink
# (template-registry.ts, useTemplates.ts categoryIcons in the
# demo-live-preview worktree), in the same order.
categories:
  - key: flooding
    icon: i-lucide-waves
    name: { en: 'Flooding', es: 'Inundación', fr: 'Inondation', de: 'Hochwasser' }
  - key: fire
    icon: i-lucide-flame
    name: { en: 'Fire or smoke', es: 'Incendio o humo', fr: 'Incendie ou fumée', de: 'Brand oder Rauch' }
  - key: building-damage
    icon: i-lucide-building-2
    name: { en: 'Building damage', es: 'Daño edificio', fr: 'Dégâts bâtiment', de: 'Gebäudeschaden' }
  - key: power-outage
    icon: i-lucide-zap-off
    name: { en: 'Power outage', es: 'Corte de luz', fr: 'Coupure courant', de: 'Stromausfall' }
  - key: road-block
    icon: i-lucide-octagon-alert
    name: { en: 'Road block', es: 'Corte de vía', fr: 'Route bloquée', de: 'Straßensperre' }
  - key: debris
    icon: i-lucide-tree-pine
    name: { en: 'Debris or fallen tree', es: 'Escombros o árbol caído', fr: 'Débris ou arbre tombé', de: 'Trümmer oder umgestürzter Baum' }
  - key: drop-in-point
    icon: i-lucide-map-pin-house
    name: { en: 'Drop-in point', es: 'Punto de atención', fr: 'Point d''accueil', de: 'Anlaufstelle' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature, and the demo names no authority.
organisations: []

start_page:
  title:
    en: 'Welcome to the storm map of the Helferkreis Lindbach'
    es: 'Bienvenido al mapa de la tormenta del Helferkreis Lindbach'
    fr: 'Bienvenue sur la carte de la tempête du Helferkreis Lindbach'
    de: 'Willkommen bei der Sturmkarte des Helferkreises Lindbach'
  body:
    en: '<p>After a night of storm and heavy rain, residents report what they see here: flooded spots, fallen trees, damaged roofs, power cuts, closed roads and the drop-in point of the helper circle. The volunteers of the Helferkreis Lindbach check every report with a second person or a photo and mark it as confirmed, all clear or not confirmed.</p><p><strong>This map does not replace an emergency call. In an emergency, call 112.</strong></p><p>This is a demo with a fictional exercise scenario: the storm night, the Helferkreis Lindbach and all reports are fictional; the streets on the map are real. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Tras una noche de tormenta y lluvias fuertes, los vecinos señalan aquí lo que ven: zonas inundadas, árboles caídos, tejados dañados, cortes de luz, calles cortadas y el punto de atención del grupo de ayuda. Los voluntarios del Helferkreis Lindbach comprueban cada aviso con una segunda persona o una foto y lo marcan como confirmado, fin de la alerta o no confirmado.</p><p><strong>Este mapa no sustituye a una llamada de emergencia. En caso de emergencia, llama al 112.</strong></p><p>Esto es una demostración con un ejercicio ficticio: la noche de tormenta, el Helferkreis Lindbach y todos los avisos son ficticios; las calles del mapa son reales. Todo lo que añadas se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Après une nuit de tempête et de fortes pluies, les habitants signalent ici ce qu''ils voient : endroits inondés, arbres tombés, toits endommagés, coupures de courant, routes fermées et le point d''accueil du groupe d''entraide. Les bénévoles du Helferkreis Lindbach vérifient chaque signalement avec une deuxième personne ou une photo et le marquent comme confirmé, fin d''alerte ou non confirmé.</p><p><strong>Cette carte ne remplace pas un appel d''urgence. En cas d''urgence, appelez le 112.</strong></p><p>Ceci est une démo avec un exercice fictif : la nuit de tempête, le Helferkreis Lindbach et tous les signalements sont fictifs ; les rues de la carte sont réelles. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Nach einer Nacht mit Sturm und Starkregen melden Anwohner hier, was sie sehen: überflutete Stellen, umgestürzte Bäume, beschädigte Dächer, Stromausfälle, gesperrte Straßen und die Anlaufstelle des Helferkreises. Die Ehrenamtlichen des Helferkreises Lindbach prüfen jede Meldung mit einer zweiten Person oder einem Foto und markieren sie als bestätigt, entwarnt oder nicht bestätigt.</p><p><strong>Diese Karte ersetzt keinen Notruf. Im Notfall wähle 112.</strong></p><p>Dies ist eine Demo mit einem erfundenen Übungsszenario: Die Sturmnacht, der Helferkreis Lindbach und alle Meldungen sind erfunden, die Straßen auf der Karte sind echt. Alles, was du einträgst, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the flooded underpass and read how the helper circle confirmed the report and gave the all clear. Then report what you noticed after the storm.'
  es: 'Abre el paso inferior inundado y lee cómo el grupo de ayuda confirmó el aviso y dio el fin de la alerta. Después señala lo que te llamó la atención tras la tormenta.'
  fr: 'Ouvrez le passage souterrain inondé et lisez comment le groupe d''entraide a confirmé le signalement puis levé l''alerte. Signalez ensuite ce que vous avez remarqué après la tempête.'
  de: 'Öffne die überflutete Unterführung und lies, wie der Helferkreis die Meldung bestätigt und entwarnt hat. Melde dann, was dir nach dem Sturm aufgefallen ist.'

reports:
  - key: flooded-underpass
    category: flooding
    lat: 51.14422
    lng: 7.21913
    address: { address_line1: 'Bahnhofstraße', postal_code: '42929', locality: 'Wermelskirchen', country_code: DE }
    time: '23:40'
    photo:
      file: images/crisis-map-flooded-underpass.jpg
      alt:
        en: 'A short pedestrian and cycle underpass with concrete walls, brown water standing about knee-deep inside, leaves and twigs floating on it.'
        es: 'Un paso inferior corto para peatones y bicicletas con paredes de hormigón, con agua marrón estancada hasta la rodilla y hojas y ramas flotando.'
        fr: 'Un court passage souterrain piétons et vélos aux murs en béton, rempli d''eau brune jusqu''aux genoux, avec des feuilles et des brindilles qui flottent.'
        de: 'Eine kurze Fuß- und Radwegunterführung mit Betonwänden, darin steht braunes Wasser etwa knietief, Laub und Zweige treiben darauf.'
    title:
      en: 'Underpass on the cycle path flooded'
      es: 'Paso inferior del carril bici inundado'
      fr: 'Passage souterrain de la piste cyclable inondé'
      de: 'Unterführung am Radweg überflutet'
    description:
      en: 'The underpass on the cycle path is full of water. I could not see how deep it is, so I turned back.'
      es: 'El paso inferior del carril bici está lleno de agua. No se veía la profundidad, así que me di la vuelta.'
      fr: 'Le passage souterrain de la piste cyclable est plein d''eau. Je ne voyais pas la profondeur, alors j''ai fait demi-tour.'
      de: 'Die Unterführung am Radweg steht voll Wasser. Ich konnte nicht sehen, wie tief es ist, und bin umgekehrt.'
    history:
      - status: unconfirmed
        days_ago: 2
        note:
          en: 'Thank you, we have received your report. We will check it.'
          es: 'Gracias, hemos recibido tu aviso. Lo vamos a comprobar.'
          fr: 'Merci, nous avons bien reçu votre signalement. Nous allons le vérifier.'
          de: 'Danke, deine Meldung ist eingegangen. Wir prüfen sie.'
      - status: confirmed
        days_ago: 1
        time: '00:25'
        note:
          en: 'Confirmed: a second person sent a photo from the other side. The water is about knee-deep. Please do not walk or cycle through the underpass and take another way.'
          es: 'Confirmado: una segunda persona envió una foto desde el otro lado. El agua llega más o menos a la rodilla. No pases a pie ni en bici por el paso inferior y toma otro camino.'
          fr: 'Confirmé : une deuxième personne a envoyé une photo prise de l''autre côté. L''eau arrive à peu près aux genoux. Ne traversez pas le passage à pied ni à vélo et prenez un autre chemin.'
          de: 'Bestätigt: Eine zweite Person hat ein Foto von der anderen Seite geschickt. Das Wasser steht etwa knietief. Bitte nicht zu Fuß oder mit dem Rad durch die Unterführung, nimm einen anderen Weg.'
      - status: confirmed
        days_ago: 1
        time: '07:30'
        note:
          en: 'Update in the morning: the water has dropped to ankle height. The drain at the low point is blocked with leaves, so the underpass stays marked for now.'
          es: 'Actualización por la mañana: el agua ha bajado hasta el tobillo. El desagüe del punto más bajo está tapado con hojas, así que el paso inferior sigue marcado por ahora.'
          fr: 'Point du matin : l''eau est descendue au niveau des chevilles. L''évacuation au point bas est bouchée par des feuilles, le passage reste donc signalé pour l''instant.'
          de: 'Stand am Morgen: Das Wasser ist auf Knöchelhöhe gesunken. Der Abfluss an der tiefsten Stelle ist mit Laub verstopft, deshalb bleibt die Unterführung vorerst markiert.'
      - status: all-clear
        days_ago: 1
        time: '16:10'
        note:
          en: 'All clear: volunteers cleared the leaves from the drain and the water has run off. The underpass is passable again; there is still mud on the path, so take care.'
          es: 'Fin de la alerta: los voluntarios quitaron las hojas del desagüe y el agua se ha ido. El paso inferior vuelve a ser transitable; todavía hay barro en el camino, así que ten cuidado.'
          fr: 'Fin d''alerte : des bénévoles ont dégagé les feuilles de l''évacuation et l''eau s''est écoulée. Le passage est de nouveau praticable ; il reste de la boue sur le chemin, soyez prudent.'
          de: 'Entwarnung: Ehrenamtliche haben das Laub aus dem Abfluss geholt, das Wasser ist abgelaufen. Die Unterführung ist wieder passierbar, auf dem Weg liegt noch Schlamm, also Vorsicht.'

