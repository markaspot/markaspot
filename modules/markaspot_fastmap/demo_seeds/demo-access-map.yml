# Template demo: access-map ("Barrier map", DE "Barrierenmelder").
# Format: README.md of the demo seeds. Real geometry, fictional names: the
# pins lie in a real old town (Siegburg), placed at real crossings and bus
# stops taken from OpenStreetMap. The "Initiative Freie Wege", the people and
# all reports are fictional. No real lift, shop or building is named or
# accused: the temporary cases are obstacles on the pavement, the one
# entrance with steps stays anonymous.
# No addresses are given on purpose: the geocoder fills them.
# Story: a disability initiative runs the map. It checks every report on
# site, confirms lasting barriers (they stay "Confirmed" on the map until
# they are really gone), hands confirmed barriers to the city as a list and
# clears small things directly on site. The city makes no promise and never
# answers here.
# Times: people report during the day, the initiative answers in the late
# afternoon; entries without a time get a stable derived one.
# The statuses mirror the access-map set in
# WorkspaceProvisioningService::STATUS_TEMPLATES exactly (keys, names,
# mappings).
version: 1
slug: demo-access-map
template: access-map
seed_version: 3
default_language: en
languages: [en, es, fr, de]
wording: report
ai_system_prompt: >-
  Purpose: a barrier map for an accessible town. Citizens document places where people using
  wheelchairs, walkers, prams or a white cane cannot get through. Valid observations: missing
  ramps or curb cuts, steps without an alternative, broken or missing elevators, obstacles on the
  sidewalk (parked bikes, signs, construction), missing tactile paving, building entrances without
  step-free access. Exclusions: general road damage that does not block anyone, private property
  interiors, people as the main subject. If the barrier is not clearly visible, say so instead of
  guessing.
name: 'Freie Wege Barrier Map'
claim:
  en: 'Make barriers visible'
  es: 'Hacer visibles las barreras'
  fr: 'Rendre les obstacles visibles'
  de: 'Barrieren sichtbar machen'
map:
  lat: 50.7968
  lng: 7.2068
  zoom: 16
boundary:
  radius_km: 0.7
operator:
  email: support@civicpatches.de
  address:
    organization: 'Civic Patches GmbH'
    address_line1: 'Pingsdorfer Str. 88-92'
    postal_code: '50321'
    locality: 'Brühl'
    country_code: DE

statuses:
  - key: recorded
    mapping: initial
    hex: '#D97706'
    icon: i-lucide-circle-plus
    name: { en: 'Recorded', es: 'Registrado', fr: 'Enregistré', de: 'Erfasst' }
  - key: confirmed
    mapping: open
    hex: '#2563EB'
    icon: i-lucide-badge-check
    name: { en: 'Confirmed', es: 'Confirmado', fr: 'Confirmé', de: 'Bestätigt' }
  - key: handed-over
    mapping: open
    hex: '#0891B2'
    icon: i-lucide-send
    name: { en: 'Handed over', es: 'Entregado', fr: 'Transmis', de: 'Übergeben' }
  - key: removed
    mapping: closed
    hex: '#059669'
    icon: i-lucide-check
    name: { en: 'Removed', es: 'Eliminado', fr: 'Supprimé', de: 'Beseitigt' }

# Names and icons follow the access-map template (template-registry.ts,
# useTemplates.ts categoryIcons), in the same order. "Broken elevator" and
# "Inaccessible building" have no seeded report on purpose (no real lift or
# building is accused); visitors can still use them.
categories:
  - key: missing-ramp
    icon: i-lucide-accessibility
    name: { en: 'Missing ramp', es: 'Rampa faltante', fr: 'Rampe manquante', de: 'Fehlende Rampe' }
  - key: broken-elevator
    icon: i-lucide-move-vertical
    name: { en: 'Broken elevator', es: 'Ascensor averiado', fr: 'Ascenseur en panne', de: 'Defekter Aufzug' }
  - key: curb-cut
    icon: i-lucide-route
    name: { en: 'Missing curb cut', es: 'Bordillo sin rebaje', fr: 'Bordure non abaissée', de: 'Fehlende Bordsteinabsenkung' }
  - key: sidewalk-obstacle
    icon: i-lucide-octagon-alert
    name: { en: 'Sidewalk obstacle', es: 'Obstáculo en acera', fr: 'Obstacle trottoir', de: 'Gehweghindernis' }
  - key: tactile-paving
    icon: i-lucide-eye-off
    name: { en: 'Missing tactile paving', es: 'Pavimento táctil ausente', fr: 'Guidage tactile manquant', de: 'Fehlendes Blindenleitsystem' }
  - key: inaccessible-building
    icon: i-lucide-door-open
    name: { en: 'Inaccessible building', es: 'Edificio inaccesible', fr: 'Bâtiment inaccessible', de: 'Nicht barrierefreies Gebäude' }

# No organisations: CivicSpot workspaces do not have the organisations
# feature. The city appears only in the notes, as the recipient of what the
# initiative hands over.
organisations: []

start_page:
  title:
    en: 'Welcome to the Freie Wege barrier map'
    es: 'Bienvenido al mapa de barreras de Freie Wege'
    fr: 'Bienvenue sur la carte des obstacles de Freie Wege'
    de: 'Willkommen beim Barrierenmelder von Freie Wege'
  body:
    en: '<p>People with wheelchairs, rollators, prams or white canes report barriers in the old town here: high kerbs, steps at entrances, missing guidance strips, obstacles on the pavement. The Initiative Freie Wege checks every report on site. A confirmed barrier stays visible on the map until it is really gone. The initiative hands confirmed barriers to the city as a list and clears small things directly with those responsible on site.</p><p>Please describe the barrier, not the people. Do not name shops or persons.</p><p>This is a demo. The Initiative Freie Wege and all reports are fictional; the streets on the map are real. Everything you add is removed at the next regular reset.</p>'
    es: '<p>Aquí las personas en silla de ruedas, con andador, con carrito de bebé o con bastón blanco señalan las barreras del casco antiguo: bordillos altos, escalones en las entradas, guías táctiles que faltan, obstáculos en la acera. La Initiative Freie Wege comprueba cada aviso sobre el terreno. Una barrera confirmada sigue visible en el mapa hasta que desaparece de verdad. La iniciativa entrega al ayuntamiento las barreras confirmadas en una lista y resuelve las cosas pequeñas directamente con los responsables en el lugar.</p><p>Describe la barrera, no a las personas. No nombres tiendas ni personas.</p><p>Esto es una demostración. La Initiative Freie Wege y todos los avisos son ficticios; las calles del mapa son reales. Todo lo que añadas se borrará en el próximo restablecimiento.</p>'
    fr: '<p>Les personnes en fauteuil roulant, avec un déambulateur, une poussette ou une canne blanche signalent ici les obstacles de la vieille ville : bordures hautes, marches aux entrées, bandes de guidage manquantes, obstacles sur le trottoir. L''Initiative Freie Wege vérifie chaque signalement sur place. Un obstacle confirmé reste visible sur la carte jusqu''à ce qu''il ait vraiment disparu. L''initiative remet à la ville la liste des obstacles confirmés et règle les petites choses directement avec les responsables sur place.</p><p>Décrivez l''obstacle, pas les personnes. Ne nommez ni commerces ni personnes.</p><p>Ceci est une démo. L''Initiative Freie Wege et tous les signalements sont fictifs ; les rues de la carte sont réelles. Tout ce que vous ajoutez sera supprimé lors de la prochaine réinitialisation.</p>'
    de: '<p>Menschen mit Rollstuhl, Rollator, Kinderwagen oder Blindenstock melden hier Barrieren in der Altstadt: hohe Bordsteine, Stufen an Eingängen, fehlende Leitstreifen, Hindernisse auf dem Gehweg. Die Initiative Freie Wege prüft jede Meldung vor Ort. Eine bestätigte Barriere bleibt auf der Karte sichtbar, bis sie wirklich weg ist. Bestätigte Barrieren übergibt die Initiative gesammelt als Liste an die Stadt, Kleinigkeiten klärt sie direkt mit den Verantwortlichen vor Ort.</p><p>Beschreib bitte die Barriere, nicht die Menschen. Nenn keine Geschäfte und keine Personen.</p><p>Dies ist eine Demo. Die Initiative Freie Wege und alle Meldungen sind erfunden, die Straßen auf der Karte sind echt. Alles, was du einträgst, wird beim nächsten regelmäßigen Zurücksetzen entfernt.</p>'

task:
  en: 'Open the high kerb at the traffic lights and read how the initiative stayed on it until the barrier was gone. Then report a barrier on your own way through town.'
  es: 'Abre el bordillo alto del semáforo y lee cómo la iniciativa siguió el caso hasta que la barrera desapareció. Después señala una barrera en tu propio camino por la ciudad.'
  fr: 'Ouvrez la bordure haute au feu et lisez comment l''initiative a suivi le cas jusqu''à la disparition de l''obstacle. Signalez ensuite un obstacle sur votre propre trajet en ville.'
  de: 'Öffne den hohen Bordstein an der Ampel und lies, wie die Initiative drangeblieben ist, bis die Barriere weg war. Melde dann eine Barriere auf deinem eigenen Weg durch die Stadt.'

reports:
  - key: high-kerb
    category: curb-cut
    lat: 50.79662
    lng: 7.2026
    address: { address_line1: 'Wilhelmstraße', postal_code: '53721', locality: 'Siegburg', country_code: DE }
    time: '10:15'
    photo:
      file: images/access-map-high-kerb.jpg
      alt:
        en: 'A pedestrian crossing at traffic lights with a high granite kerb along its whole width and no lowered section, the opposite kerb just as high.'
        es: 'Un paso de peatones con semáforo y un bordillo alto de granito en toda su anchura, sin rebaje, y el bordillo de enfrente igual de alto.'
        fr: 'Un passage piéton à un feu avec une haute bordure en granit sur toute sa largeur, sans abaissement, la bordure d''en face tout aussi haute.'
        de: 'Ein Fußgängerüberweg an einer Ampel mit hohem Granitbordstein auf ganzer Breite ohne Absenkung, der Bordstein gegenüber ebenso hoch.'
    title:
      en: 'High kerb at the traffic lights'
      es: 'Bordillo alto en el semáforo'
      fr: 'Bordure haute au feu'
      de: 'Hoher Bordstein an der Ampel'
    description:
      en: 'At this crossing the kerb is high on both sides. With my wheelchair I cannot get onto the pavement without help, and with a rollator it is just as hard.'
      es: 'En este paso el bordillo es alto por los dos lados. Con mi silla de ruedas no puedo subir a la acera sin ayuda, y con andador es igual de difícil.'
      fr: 'À ce passage, la bordure est haute des deux côtés. En fauteuil roulant, je ne peux pas monter sur le trottoir sans aide, et avec un déambulateur c''est tout aussi difficile.'
      de: 'An diesem Überweg ist der Bordstein auf beiden Seiten hoch. Mit meinem Rollstuhl komme ich ohne Hilfe nicht auf den Gehweg, mit Rollator ist es genauso schwer.'
    history:
      - status: recorded
        days_ago: 38
        note:
          en: 'Thank you, we have received your report. We will look at the spot ourselves.'
          es: 'Gracias, hemos recibido tu aviso. Iremos a ver el lugar nosotros mismos.'
          fr: 'Merci, nous avons bien reçu votre signalement. Nous irons voir l''endroit nous-mêmes.'
          de: 'Danke, deine Meldung ist eingegangen. Wir schauen uns die Stelle selbst an.'
      - status: confirmed
        days_ago: 35
        time: '17:30'
        note:
          en: 'Two of us checked the crossing with a wheelchair and a rollator: the kerb is about 10 cm high on both sides and there is no lowered section. A second report about the same crossing has come in. The barrier stays on the map as confirmed.'
          es: 'Dos de nosotros comprobamos el paso con una silla de ruedas y un andador: el bordillo mide unos 10 cm por ambos lados y no hay ningún rebaje. Ha llegado un segundo aviso sobre el mismo paso. La barrera queda en el mapa como confirmada.'
          fr: 'Deux d''entre nous ont vérifié le passage avec un fauteuil roulant et un déambulateur : la bordure fait environ 10 cm des deux côtés et il n''y a aucun abaissement. Un deuxième signalement sur le même passage nous est parvenu. L''obstacle reste sur la carte comme confirmé.'
          de: 'Zwei von uns haben den Überweg mit Rollstuhl und Rollator geprüft: Der Bordstein ist auf beiden Seiten etwa 10 cm hoch, eine Absenkung gibt es nicht. Eine zweite Meldung zum selben Überweg ist eingegangen. Die Barriere bleibt als bestätigt auf der Karte.'
      - status: handed-over
        days_ago: 28
        time: '18:00'
        note:
          en: 'We have handed the city a list of 11 confirmed kerbs in the old town, with photos and measurements. This crossing is at the top of the list because it leads to the bus stops.'
          es: 'Hemos entregado al ayuntamiento una lista de 11 bordillos confirmados en el casco antiguo, con fotos y medidas. Este paso encabeza la lista porque lleva a las paradas de autobús.'
          fr: 'Nous avons remis à la ville une liste de 11 bordures confirmées dans la vieille ville, avec photos et mesures. Ce passage figure en tête de liste, car il mène aux arrêts de bus.'
          de: 'Wir haben der Stadt eine Liste mit 11 bestätigten Bordsteinen in der Altstadt übergeben, mit Fotos und Maßen. Dieser Überweg steht ganz oben, weil er zu den Bushaltestellen führt.'
      - status: removed
        days_ago: 4
        time: '16:40'
        note:
          en: 'The kerbs at this crossing were lowered during road works last week. We checked again with the wheelchair: you can now cross without help. Thank you to everyone who reported it.'
          es: 'Los bordillos de este paso se rebajaron durante unas obras la semana pasada. Lo volvimos a comprobar con la silla de ruedas: ahora se puede cruzar sin ayuda. Gracias a todos los que lo señalaron.'
          fr: 'Les bordures de ce passage ont été abaissées lors de travaux la semaine dernière. Nous avons vérifié à nouveau avec le fauteuil roulant : on peut désormais traverser sans aide. Merci à toutes celles et ceux qui l''ont signalé.'
          de: 'Die Bordsteine an diesem Überweg wurden letzte Woche bei Bauarbeiten abgesenkt. Wir haben noch einmal mit dem Rollstuhl geprüft: Man kommt jetzt ohne Hilfe hinüber. Danke an alle, die es gemeldet haben.'

  - key: entrance-steps
    category: missing-ramp
    lat: 50.79815
    lng: 7.20935
    address: { address_line1: 'Holzgasse', postal_code: '53721', locality: 'Siegburg', country_code: DE }
    photo:
      file: images/access-map-entrance-steps.jpg
      alt:
        en: 'The entrance of a small shop in an old town house, two worn stone steps up to a narrow wooden door, no handrail and no ramp.'
        es: 'La entrada de una pequeña tienda en una casa del casco antiguo, dos escalones de piedra gastados hasta una puerta de madera estrecha, sin barandilla ni rampa.'
        fr: 'L''entrée d''une petite boutique dans une maison de la vieille ville, deux marches en pierre usées jusqu''à une porte en bois étroite, sans main courante ni rampe.'
        de: 'Der Eingang eines kleinen Ladens in einem Altstadthaus, zwei ausgetretene Steinstufen hinauf zu einer schmalen Holztür, kein Handlauf, keine Rampe.'
    title:
      en: 'Two steps at a shop entrance'
      es: 'Dos escalones en la entrada de una tienda'
      fr: 'Deux marches à l''entrée d''une boutique'
      de: 'Zwei Stufen am Ladeneingang'
    description:
      en: 'Two high steps lead up to the entrance. There is no ramp and no bell, so with a wheelchair you have to wait until someone comes out.'
      es: 'Dos escalones altos llevan a la entrada. No hay rampa ni timbre, así que en silla de ruedas hay que esperar a que salga alguien.'
      fr: 'Deux hautes marches mènent à l''entrée. Il n''y a ni rampe ni sonnette : en fauteuil roulant, il faut attendre que quelqu''un sorte.'
      de: 'Zwei hohe Stufen führen zum Eingang. Es gibt keine Rampe und keine Klingel, mit dem Rollstuhl muss man warten, bis jemand herauskommt.'
    history:
      - status: recorded
        days_ago: 20
        note:
          en: 'Thank you, we have received your report. We will look at the spot ourselves.'
          es: 'Gracias, hemos recibido tu aviso. Iremos a ver el lugar nosotros mismos.'
          fr: 'Merci, nous avons bien reçu votre signalement. Nous irons voir l''endroit nous-mêmes.'
          de: 'Danke, deine Meldung ist eingegangen. Wir schauen uns die Stelle selbst an.'
      - status: confirmed
        days_ago: 18
        time: '16:50'
        note:
          en: 'Confirmed: two steps of about 15 cm each, no handrail, no bell. We have spoken to the people who run the shop. They are looking into a mobile ramp and a bell. Until then the barrier stays on the map.'
          es: 'Confirmado: dos escalones de unos 15 cm cada uno, sin barandilla ni timbre. Hemos hablado con las personas que llevan la tienda. Están estudiando una rampa móvil y un timbre. Hasta entonces la barrera sigue en el mapa.'
          fr: 'Confirmé : deux marches d''environ 15 cm chacune, sans main courante ni sonnette. Nous avons parlé aux personnes qui tiennent la boutique. Elles étudient une rampe mobile et une sonnette. D''ici là, l''obstacle reste sur la carte.'
          de: 'Bestätigt: zwei Stufen von je etwa 15 cm, kein Handlauf, keine Klingel. Wir haben mit den Menschen gesprochen, die den Laden führen. Sie prüfen eine mobile Rampe und eine Klingel. Bis dahin bleibt die Barriere auf der Karte.'

  - key: bus-stop-guidance
