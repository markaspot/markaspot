      es: 'Sin franja guía en la parada de autobús'
      fr: 'Pas de bande de guidage à l''arrêt de bus'
      de: 'Kein Leitstreifen an der Bushaltestelle'
    description:
      en: 'At this bus stop there is no tactile paving. With a white cane I cannot find the place where the front door of the bus opens.'
      es: 'En esta parada no hay pavimento táctil. Con el bastón blanco no encuentro el lugar donde se abre la puerta delantera del autobús.'
      fr: 'À cet arrêt, il n''y a pas de guidage tactile. Avec ma canne blanche, je ne trouve pas l''endroit où s''ouvre la porte avant du bus.'
      de: 'An dieser Haltestelle gibt es kein Blindenleitsystem. Mit dem Blindenstock finde ich die Stelle nicht, an der die vordere Bustür aufgeht.'
    history:
      - status: recorded
        days_ago: 14
        note:
          en: 'Thank you, we have received your report. We will look at the spot ourselves.'
          es: 'Gracias, hemos recibido tu aviso. Iremos a ver el lugar nosotros mismos.'
          fr: 'Merci, nous avons bien reçu votre signalement. Nous irons voir l''endroit nous-mêmes.'
          de: 'Danke, deine Meldung ist eingegangen. Wir schauen uns die Stelle selbst an.'
      - status: confirmed
        days_ago: 12
        time: '17:15'
        note:
          en: 'Confirmed: there is no guidance strip and no entry field at this stop. One of our members who is blind walked it with us.'
          es: 'Confirmado: en esta parada no hay franja guía ni campo de entrada. Una de nuestras socias, que es ciega, la recorrió con nosotros.'
          fr: 'Confirmé : il n''y a ni bande de guidage ni zone d''accès à cet arrêt. Une de nos membres, aveugle, l''a parcouru avec nous.'
          de: 'Bestätigt: An dieser Haltestelle gibt es weder Leitstreifen noch Einstiegsfeld. Ein blindes Mitglied unserer Initiative ist sie mit uns abgegangen.'
      - status: handed-over
        days_ago: 7
        time: '18:10'
        note:
          en: 'We have handed this stop to the city together with four other bus stops in the old town that have no guidance strips.'
          es: 'Hemos entregado esta parada al ayuntamiento junto con otras cuatro paradas del casco antiguo que no tienen franja guía.'
          fr: 'Nous avons transmis cet arrêt à la ville avec quatre autres arrêts de la vieille ville qui n''ont pas de bande de guidage.'
          de: 'Wir haben diese Haltestelle zusammen mit vier weiteren Haltestellen ohne Leitstreifen in der Altstadt an die Stadt übergeben.'

