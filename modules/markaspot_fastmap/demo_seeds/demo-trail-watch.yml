        time: '18:20'
        note:
          en: 'The sign team mounted a new arm today. The way to the hut is signposted again.'
          es: 'El equipo de señalización ha montado hoy un brazo nuevo. El camino al refugio vuelve a estar señalizado.'
          fr: 'L''équipe de balisage a posé une nouvelle flèche aujourd''hui. Le chemin du refuge est de nouveau indiqué.'
          de: 'Das Schilderteam hat heute einen neuen Arm angebracht. Der Weg zur Hütte ist wieder ausgeschildert.'

  - key: loose-handrail
    category: damaged-bridge
    lat: 50.65595
    lng: 7.2344
    address: { address_line1: 'Tretschbachtal', postal_code: '53604', locality: 'Bad Honnef', country_code: DE }
    time: '16:05'
    photo:
      file: images/trail-watch-footbridge.jpg
      alt:
        en: 'A small wooden footbridge over a forest brook, the handrail on one side broken and hanging down, a post leaning, wet planks covered in leaves.'
        es: 'Una pequeña pasarela de madera sobre un arroyo del bosque, con la barandilla de un lado rota y colgando, un poste inclinado y tablones mojados cubiertos de hojas.'
        fr: 'Une petite passerelle en bois au-dessus d''un ruisseau forestier, la main courante d''un côté cassée et pendante, un poteau penché, des planches mouillées couvertes de feuilles.'
        de: 'Ein kleiner Holzsteg über einen Waldbach, das Geländer auf einer Seite gebrochen und herabhängend, ein Pfosten schief, nasse Bohlen voller Laub.'
    title:
      en: 'Handrail on the footbridge is loose'
      es: 'La barandilla de la pasarela está suelta'
      fr: 'La main courante de la passerelle ne tient plus'
      de: 'Geländer am Steg ist lose'
    description:
      en: 'On the small footbridge over the brook one handrail hangs down and a post wobbles. The planks are slippery when wet.'
      es: 'En la pequeña pasarela sobre el arroyo una barandilla cuelga y un poste se mueve. Los tablones resbalan cuando están mojados.'
      fr: 'Sur la petite passerelle au-dessus du ruisseau, une main courante pend et un poteau branle. Les planches sont glissantes quand elles sont mouillées.'
      de: 'Am kleinen Steg über den Bach hängt ein Geländer herunter und ein Pfosten wackelt. Die Bohlen sind bei Nässe rutschig.'
    history:
      - status: reported
        days_ago: 6
        note:
          en: 'Thank you, we have received your report.'
          es: 'Gracias, hemos recibido tu aviso.'
          fr: 'Merci, nous avons bien reçu votre signalement.'
          de: 'Danke, deine Meldung ist eingegangen.'
      - status: in-progress
        days_ago: 5
        time: '20:20'
        note:
          en: 'Confirmed: the handrail on the downstream side is loose and one post is rotten. We have marked it with warning tape. The footbridge belongs to the forest owner, so we have sent the photos to the forestry office and offered our help with the repair.'
          es: 'Confirmado: la barandilla del lado de aguas abajo está suelta y un poste está podrido. La hemos marcado con cinta de aviso. La pasarela pertenece al propietario del bosque, así que hemos enviado las fotos a la oficina forestal y ofrecido nuestra ayuda para la reparación.'
          fr: 'Confirmé : la main courante côté aval ne tient plus et un poteau est pourri. Nous l''avons signalée avec de la rubalise. La passerelle appartient au propriétaire de la forêt : nous avons envoyé les photos à l''office forestier et proposé notre aide pour la réparation.'
          de: 'Bestätigt: Das Geländer auf der Seite bachabwärts ist lose, ein Pfosten ist morsch. Wir haben es mit Flatterband markiert. Der Steg gehört dem Waldbesitzer, deshalb haben wir die Fotos an das Forstamt geschickt und unsere Hilfe bei der Reparatur angeboten.'

