services:
  logger.channel.markaspot_fastmap:
    parent: logger.channel_base
    arguments: ['markaspot_fastmap']

  markaspot_fastmap.tier_config:
    class: Drupal\markaspot_fastmap\Service\TierConfigService
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@logger.channel.markaspot_fastmap'
      - '@database'

  markaspot_fastmap.workspace_provisioning:
    class: Drupal\markaspot_fastmap\Service\WorkspaceProvisioningService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.markaspot_fastmap'
      - '@language_manager'
      - '@config.factory'
      - '@datetime.time'
      - '@lock'
      - '@?markaspot_ai.client'
      - '@markaspot_nuxt.citizen_wording_resolver'

  markaspot_fastmap.workspace_visibility:
    class: Drupal\markaspot_fastmap\Service\WorkspaceVisibilityService
    arguments:
      - '@entity_type.manager'

  markaspot_fastmap.billing_state_resolver:
    class: Drupal\markaspot_fastmap\Service\BillingStateResolver

  markaspot_fastmap.legal_notice_generator:
    class: Drupal\markaspot_fastmap\Service\LegalNoticeGenerator
    arguments:
      - '@twig'
      - '@language_manager'
      - '@module_handler'
      - '@logger.channel.markaspot_fastmap'
