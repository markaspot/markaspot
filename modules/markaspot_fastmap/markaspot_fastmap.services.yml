services:
  logger.channel.markaspot_fastmap:
    parent: logger.channel_base
    arguments: ['markaspot_fastmap']

  markaspot_fastmap.tier_config:
    class: Drupal\markaspot_fastmap\Service\TierConfigService
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@logger.channel.markaspot_fastmap'
      - '@database'

  markaspot_fastmap.workspace_provisioning:
    class: Drupal\markaspot_fastmap\Service\WorkspaceProvisioningService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.markaspot_fastmap'
      - '@language_manager'
      - '@config.factory'
      - '@datetime.time'
      - '@lock'
      - '@markaspot_fastmap.placeholder_signet_generator'
      - '@file.repository'
      - '@file_system'
      - '@?markaspot_ai.client'
      - '@?markaspot_nuxt.citizen_wording_resolver'
      - '@file.usage'

  markaspot_fastmap.placeholder_signet_generator:
    class: Drupal\markaspot_fastmap\Service\PlaceholderSignetGenerator

  markaspot_fastmap.billing_state_resolver:
    class: Drupal\markaspot_fastmap\Service\BillingStateResolver

  markaspot_fastmap.legal_notice_generator:
    class: Drupal\markaspot_fastmap\Service\LegalNoticeGenerator
    arguments:
      - '@twig'
      - '@language_manager'
      - '@module_handler'
      - '@logger.channel.markaspot_fastmap'
      - '@?address.country_repository'

  markaspot_fastmap.workspace_deletion:
    class: Drupal\markaspot_fastmap\Service\WorkspaceDeletionService
    arguments:
      - '@entity_type.manager'
      - '@keyvalue.expirable'
      - '@keyvalue'
      - '@lock'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@datetime.time'
      - '@date.formatter'
      - '@logger.channel.markaspot_fastmap'
      - '@markaspot_fastmap.workspace_provisioning'
      - '@entity_field.manager'

  markaspot_fastmap.demo_workspace_seeder:
    class: Drupal\markaspot_fastmap\Service\DemoWorkspaceSeeder
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@config.factory'
      - '@markaspot_fastmap.workspace_provisioning'
      - '@file_system'
      - '@keyvalue'
      - '@state'
      - '@lock'
      - '@database'
      - '@datetime.time'
      - '@account_switcher'
      - '@logger.channel.markaspot_fastmap'
      - '@?markaspot_fastmap.legal_notice_generator'

  markaspot_fastmap.demo_workspace_reset:
    class: Drupal\markaspot_fastmap\Service\DemoWorkspaceReset
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@markaspot_fastmap.demo_workspace_seeder'
      - '@state'
      - '@lock'
      - '@file.usage'
      - '@datetime.time'
      - '@logger.channel.markaspot_fastmap'
