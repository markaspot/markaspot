services:
  markaspot_fastmap.workspace_commands:
    class: Drupal\markaspot_fastmap\Commands\WorkspaceCommands
    arguments:
      - '@entity_type.manager'
      - '@markaspot_fastmap.workspace_deletion'
    tags:
      - { name: drush.command }
  markaspot_fastmap.demo_workspace_commands:
    class: Drupal\markaspot_fastmap\Commands\DemoWorkspaceCommands
    arguments:
      - '@markaspot_fastmap.demo_workspace_seeder'
      - '@markaspot_fastmap.demo_workspace_reset'
    tags:
      - { name: drush.command }
