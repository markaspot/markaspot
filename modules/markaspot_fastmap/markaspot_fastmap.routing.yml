markaspot_fastmap.create_workspace:
  path: '/api/fastmap/create-workspace'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::createWorkspace'
    _title: 'Create FastMap Workspace'
    _format: 'json'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.verify_workspace:
  path: '/api/fastmap/verify/{token}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::verifyWorkspace'
    _title: 'Verify FastMap Workspace'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    token: '[a-f0-9]{64}'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.claim_login_token:
  path: '/api/fastmap/claim-login-token'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::claimLoginToken'
    _title: 'Claim FastMap Login Token'
    _format: 'json'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.billing_get:
  path: '/api/fastmap/billing/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingController::get'
    _title: 'Billing Data'
    _format: 'json'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\BillingController::access'
    group: \d+
  options:
    parameters:
      group:
        type: entity:group
    no_cache: 'TRUE'

markaspot_fastmap.billing_update:
  path: '/api/fastmap/billing/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingController::update'
    _title: 'Update Billing Data'
    _format: 'json'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\BillingController::access'
    group: \d+
  options:
    parameters:
      group:
        type: entity:group
    no_cache: 'TRUE'

markaspot_fastmap.workspace_usage:
  path: '/api/fastmap/usage/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\WorkspaceUsageController::usage'
    _title: 'Workspace Usage'
    _format: 'json'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\WorkspaceUsageController::access'
    group: \d+
  options:
    parameters:
      group:
        type: entity:group
