markaspot_fastmap.create_workspace:
  path: '/api/fastmap/create-workspace'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::createWorkspace'
    _title: 'Create FastMap Workspace'
    _format: 'json'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.verify_workspace:
  path: '/api/fastmap/verify/{token}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::verifyWorkspace'
    _title: 'Verify FastMap Workspace'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    token: '[a-f0-9]{64}'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.claim_login_token:
  path: '/api/fastmap/claim-login-token'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\FastMapWorkspaceController::claimLoginToken'
    _title: 'Claim FastMap Login Token'
    _format: 'json'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.billing_get:
  path: '/api/fastmap/billing/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingController::get'
    _title: 'Billing Data'
    _format: 'json'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\BillingController::access'
    group: '[a-z0-9_-]+'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_fastmap.billing_update:
  path: '/api/fastmap/billing/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingController::update'
    _title: 'Update Billing Data'
    _format: 'json'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\BillingController::access'
    group: '[a-z0-9_-]+'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.billing_sync_token:
  path: '/api/fastmap/billing/{group}/sync-token'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingController::reserveSyncToken'
    _title: 'Reserve Billing Sync Token'
    _format: 'json'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\BillingController::access'
    group: '[a-z0-9_-]+'
  options:
    no_cache: 'TRUE'

markaspot_fastmap.workspace_usage:
  path: '/api/fastmap/usage/{group}'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\WorkspaceUsageController::usage'
    _title: 'Workspace Usage'
    _format: 'json'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_fastmap\Controller\WorkspaceUsageController::access'
    group: '[a-z0-9_-]+'
  options:
    _auth: ['cookie']

markaspot_fastmap.report_stats:
  path: '/api/fastmap/report-stats'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\ReportStatsController::stats'
    _title: 'Report Stats'
    _format: 'json'
  methods: [GET]
  requirements:
    # Jurisdiction-scoped access is enforced inside the controller (which
    # reads the jurisdiction_id query parameter); the route only requires an
    # authenticated session.
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_fastmap.accept_tos:
  path: '/api/accept-tos'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\TosController::accept'
    _title: 'Accept Terms of Service'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'
    _format: 'json'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_fastmap.tos_status:
  path: '/api/tos-status'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\TosController::status'
    _title: 'ToS Acceptance Status'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
    _format: 'json'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_fastmap.billing_admin:
  path: '/admin/markaspot/billing'
  defaults:
    _controller: '\Drupal\markaspot_fastmap\Controller\BillingAdminController::listing'
    _title: 'Tenant Billing'
  methods: [GET]
  requirements:
    _permission: 'view fastmap billing admin'
  options:
    _admin_route: true
