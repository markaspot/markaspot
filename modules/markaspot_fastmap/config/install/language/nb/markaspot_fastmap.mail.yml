langcode: nb
workspace_verification:
  subject: '@site_name: Bekreft arbeidsområdet ditt "@workspace_name"'
  body: |
    Du har bedt om et nytt arbeidsområde: @workspace_name

    Klikk på lenken nedenfor for å bekrefte og aktivere arbeidsområdet ditt:
    @verify_url

    Denne lenken utløper om @cleanup_days dager.

    Hvis du ikke ba om dette, kan du se bort fra denne e-posten.
workspace_welcome:
  subject: '@site_name: arbeidsområdet ditt "@workspace_name" er klart'
  body: |
    Arbeidsområdet ditt "@workspace_name" er nå aktivt:
    @workspace_url

    Prøv det ut: opprett din første testmelding direkte på kartet.
    Noen demomeldinger er allerede lagt inn. Du kan redigere eller slette dem når som helst.

    Administrer innkommende meldinger i dashbordet ditt:
    @workspace_url/dashboard

    Logg inn når som helst: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Bekreft sletting av arbeidsområdet "@workspace_name"'
  body: |
    Du har bedt om å slette arbeidsområdet "@workspace_name".

    Åpne denne lenken for å bekrefte slettingen:
    @confirm_url

    Lenken fungerer bare én gang og utløper om @minutes minutter.

    Når du har bekreftet, går arbeidsområdet offline med en gang og slettes for godt etter @days dager. Frem til da kan supporten vår gjenopprette det. Et betalt abonnement avsluttes umiddelbart, og inneværende måned refunderes ikke.

    Hvis du ikke ba om dette, kan du ignorere denne e-posten. Ingenting blir slettet.
workspace_deletion_scheduled:
  subject: '@site_name: Arbeidsområdet "@workspace_name" slettes @deletion_date'
  body: |
    Arbeidsområdet ditt "@workspace_name" er offline nå. Den @deletion_date fjernes det for godt, med alle meldinger, sider, kategorier, statuser og profilering.

    Har du ombestemt deg? Skriv til @support_email før @deletion_date, så gjenoppretter vi arbeidsområdet.
workspace_deletion_scheduled_paid:
  body: |
    Abonnementet ditt er avsluttet. Inneværende måned refunderes ikke.
