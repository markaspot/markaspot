langcode: uk
workspace_verification:
  subject: '@site_name: Підтвердіть ваш робочий простір "@workspace_name"'
  body: |
    Ви запросили новий робочий простір: @workspace_name

    Натисніть на посилання нижче, щоб підтвердити та активувати ваш робочий простір:
    @verify_url

    Термін дії цього посилання закінчиться через @cleanup_days днів.

    Якщо ви не надсилали цей запит, будь ласка, проігноруйте цей лист.
