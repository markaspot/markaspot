langcode: uk
workspace_verification:
  subject: '@site_name: Підтвердіть ваш робочий простір "@workspace_name"'
  body: |
    Ви запросили новий робочий простір: @workspace_name

    Натисніть на посилання нижче, щоб підтвердити та активувати ваш робочий простір:
    @verify_url

    Термін дії цього посилання закінчиться через @cleanup_days днів.

    Якщо ви не надсилали цей запит, будь ласка, проігноруйте цей лист.
workspace_welcome:
  subject: '@site_name: ваш робочий простір "@workspace_name" готовий'
  body: |
    Ваш робочий простір "@workspace_name" тепер активний:
    @workspace_url

    Спробуйте: створіть своє перше тестове повідомлення прямо на карті.
    Кілька демонстраційних повідомлень уже додано. Ви можете редагувати або видаляти їх у будь-який час.

    Керуйте вхідними повідомленнями у своїй панелі керування:
    @workspace_url/dashboard

    Заходьте в будь-який час: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Підтвердіть видалення робочого простору "@workspace_name"'
  body: |
    Ви попросили видалити робочий простір "@workspace_name".

    Відкрийте це посилання, щоб підтвердити видалення:
    @confirm_url

    Посилання працює один раз і закінчується через @minutes хвилин.

    Після підтвердження робочий простір одразу переходить в офлайн і остаточно видаляється через @days дн. До того часу наша підтримка може його відновити. Платна підписка завершується негайно, оплата за поточний місяць не повертається.

    Якщо ви цього не робили, проігноруйте цей лист. Нічого не буде видалено.
workspace_deletion_scheduled:
  subject: '@site_name: Робочий простір "@workspace_name" буде видалено @deletion_date'
  body: |
    Ваш робочий простір "@workspace_name" зараз офлайн. @deletion_date його буде остаточно видалено разом з усіма повідомленнями, сторінками, категоріями, статусами та брендингом.

    Передумали? Напишіть на @support_email до @deletion_date, і ми відновимо робочий простір.
workspace_deletion_scheduled_paid:
  body: |
    Вашу підписку завершено. Оплата за поточний місяць не повертається.
