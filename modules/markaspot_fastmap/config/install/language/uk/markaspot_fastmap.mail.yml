langcode: uk
workspace_verification:
  subject: '@site_name: Підтвердіть ваш робочий простір "@workspace_name"'
  body: |
    Ви запросили новий робочий простір: @workspace_name

    Натисніть на посилання нижче, щоб підтвердити та активувати ваш робочий простір:
    @verify_url

    Термін дії цього посилання закінчиться через @cleanup_days днів.

    Якщо ви не надсилали цей запит, будь ласка, проігноруйте цей лист.
workspace_welcome:
  subject: '@site_name: ваш робочий простір "@workspace_name" готовий'
  body: |
    Ваш робочий простір "@workspace_name" тепер активний:
    @workspace_url

    Спробуйте: створіть своє перше тестове повідомлення прямо на карті.
    Кілька демонстраційних повідомлень уже додано. Ви можете редагувати або видаляти їх у будь-який час.

    Керуйте вхідними повідомленнями у своїй панелі керування:
    @workspace_url/dashboard

    Заходьте в будь-який час: @workspace_url/auth/login
