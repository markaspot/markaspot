langcode: pt
workspace_verification:
  subject: '@site_name: Confirme o seu espaço de trabalho "@workspace_name"'
  body: |
    Solicitou um novo espaço de trabalho: @workspace_name

    Clique na ligação abaixo para confirmar e ativar o seu espaço de trabalho:
    @verify_url

    Esta ligação expira em @cleanup_days dias.

    Se não fez este pedido, ignore este e-mail.
workspace_welcome:
  subject: '@site_name: o seu espaço de trabalho "@workspace_name" está pronto'
  body: |
    O seu espaço de trabalho "@workspace_name" já está ativo:
    @workspace_url

    Experimente já: crie o seu primeiro relato de teste diretamente no mapa.
    Alguns relatos de demonstração já estão disponíveis. Pode editá-los ou eliminá-los a qualquer momento.

    Faça a gestão dos relatos recebidos no seu painel:
    @workspace_url/dashboard

    Inicie sessão a qualquer momento: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Confirme a eliminação do espaço de trabalho "@workspace_name"'
  body: |
    Solicitou a eliminação do espaço de trabalho "@workspace_name".

    Abra esta ligação para confirmar a eliminação:
    @confirm_url

    A ligação funciona apenas uma vez e expira em @minutes minutos.

    Após a confirmação, o espaço de trabalho fica offline de imediato e é eliminado definitivamente após @days dias. Até lá, o nosso suporte pode restaurá-lo. Uma subscrição paga termina de imediato e o mês em curso não é reembolsado.

    Se não fez este pedido, ignore este e-mail. Nada será eliminado.
workspace_deletion_scheduled:
  subject: '@site_name: O espaço de trabalho "@workspace_name" será eliminado em @deletion_date'
  body: |
    O seu espaço de trabalho "@workspace_name" está offline. Em @deletion_date será eliminado definitivamente, com todas as ocorrências, páginas, categorias, estados e a identidade visual.

    Mudou de ideias? Escreva para @support_email antes de @deletion_date e restauraremos o espaço de trabalho.
workspace_deletion_scheduled_paid:
  body: |
    A sua subscrição terminou. O mês em curso não é reembolsado.
