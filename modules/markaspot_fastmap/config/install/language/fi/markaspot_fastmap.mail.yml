langcode: fi
workspace_verification:
  subject: '@site_name: Vahvista työtilasi "@workspace_name"'
  body: |
    Pyysit uutta työtilaa: @workspace_name

    Vahvista ja aktivoi työtilasi klikkaamalla alla olevaa linkkiä:
    @verify_url

    Tämä linkki vanhenee @cleanup_days päivän kuluttua.

    Jos et pyytänyt tätä, voit jättää tämän sähköpostin huomiotta.
workspace_welcome:
  subject: '@site_name: työtilasi "@workspace_name" on valmis'
  body: |
    Työtilasi "@workspace_name" on nyt aktiivinen:
    @workspace_url

    Kokeile heti: luo ensimmäinen testi-ilmoituksesi suoraan kartalla.
    Muutama esimerkki-ilmoitus on jo valmiina. Voit muokata tai poistaa niitä milloin tahansa.

    Hallitse saapuvia ilmoituksia hallintapaneelissasi:
    @workspace_url/dashboard

    Kirjaudu sisään milloin tahansa: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Vahvista työtilan "@workspace_name" poisto'
  body: |
    Pyysit työtilan "@workspace_name" poistamista.

    Vahvista poisto avaamalla tämä linkki:
    @confirm_url

    Linkki toimii vain kerran ja vanhenee @minutes minuutin kuluttua.

    Vahvistuksen jälkeen työtila siirtyy heti offline-tilaan ja poistetaan lopullisesti @days päivän kuluttua. Siihen asti tukemme voi palauttaa sen. Maksullinen tilaus päättyy heti, eikä kuluvan kuukauden maksua palauteta.

    Jos et pyytänyt tätä, ohita tämä viesti. Mitään ei poisteta.
workspace_deletion_scheduled:
  subject: '@site_name: Työtila "@workspace_name" poistetaan @deletion_date'
  body: |
    Työtilasi "@workspace_name" on nyt offline-tilassa. @deletion_date se poistetaan lopullisesti kaikkine ilmoituksineen, sivuineen, luokkineen, tiloineen ja brändäyksineen.

    Muutitko mielesi? Kirjoita osoitteeseen @support_email ennen päivää @deletion_date, niin palautamme työtilan.
workspace_deletion_scheduled_paid:
  body: |
    Tilauksesi on päättynyt. Kuluvan kuukauden maksua ei palauteta.
