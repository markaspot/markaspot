langcode: pt-br
workspace_verification:
  subject: '@site_name: Confirme seu espaço de trabalho "@workspace_name"'
  body: |
    Você solicitou um novo espaço de trabalho: @workspace_name

    Clique no link abaixo para confirmar e ativar seu espaço de trabalho:
    @verify_url

    Este link expirará em @cleanup_days dias.

    Se você não solicitou isso, ignore este e-mail.
workspace_welcome:
  subject: '@site_name: seu espaço de trabalho "@workspace_name" está pronto'
  body: |
    Seu espaço de trabalho "@workspace_name" já está ativo:
    @workspace_url

    Experimente agora: crie seu primeiro relato de teste diretamente no mapa.
    Alguns relatos de demonstração já estão disponíveis. Você pode editá-los ou excluí-los quando quiser.

    Gerencie os relatos recebidos no seu painel:
    @workspace_url/dashboard

    Faça login quando quiser: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Confirme a exclusão do espaço de trabalho "@workspace_name"'
  body: |
    Você pediu para excluir o espaço de trabalho "@workspace_name".

    Abra este link para confirmar a exclusão:
    @confirm_url

    O link funciona uma única vez e expira em @minutes minutos.

    Depois da confirmação, o espaço de trabalho fica offline imediatamente e é excluído de forma definitiva após @days dias. Até lá, nosso suporte pode restaurá-lo. Uma assinatura paga termina imediatamente e o mês atual não é reembolsado.

    Se você não pediu isso, ignore este e-mail. Nada será excluído.
workspace_deletion_scheduled:
  subject: '@site_name: O espaço de trabalho "@workspace_name" será excluído em @deletion_date'
  body: |
    Seu espaço de trabalho "@workspace_name" está offline agora. Em @deletion_date ele será excluído de forma definitiva, com todos os relatos, páginas, categorias, status e a identidade visual.

    Mudou de ideia? Escreva para @support_email antes de @deletion_date e restauraremos o espaço de trabalho.
workspace_deletion_scheduled_paid:
  body: |
    Sua assinatura terminou. O mês atual não é reembolsado.
