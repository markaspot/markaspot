langcode: pl
workspace_verification:
  subject: '@site_name: Potwierdź swoją przestrzeń roboczą "@workspace_name"'
  body: |
    Wysłałeś prośbę o nową przestrzeń roboczą: @workspace_name

    Kliknij poniższy link, aby potwierdzić i aktywować swoją przestrzeń roboczą:
    @verify_url

    Ten link wygaśnie za @cleanup_days dni.

    Jeśli nie składałeś tej prośby, zignoruj tego e-maila.
workspace_welcome:
  subject: '@site_name: Twoja przestrzeń robocza "@workspace_name" jest gotowa'
  body: |
    Twoja przestrzeń robocza "@workspace_name" jest teraz aktywna:
    @workspace_url

    Wypróbuj ją: utwórz swoje pierwsze testowe zgłoszenie bezpośrednio na mapie.
    Kilka przykładowych zgłoszeń jest już dostępnych. Możesz je edytować lub usunąć w dowolnym momencie.

    Zarządzaj przychodzącymi zgłoszeniami w swoim panelu:
    @workspace_url/dashboard

    Zaloguj się w dowolnym momencie: @workspace_url/auth/login
workspace_deletion_confirm:
  subject: '@site_name: Potwierdź usunięcie przestrzeni roboczej "@workspace_name"'
  body: |
    Otrzymaliśmy prośbę o usunięcie przestrzeni roboczej "@workspace_name".

    Kliknij ten link, aby potwierdzić usunięcie:
    @confirm_url

    Link działa tylko raz i wygaśnie za @minutes min.

    Po potwierdzeniu przestrzeń robocza natychmiast przechodzi w tryb offline i zostanie trwale usunięta po upływie @days dni. Do tego czasu nasze wsparcie może ją przywrócić. Płatna subskrypcja kończy się od razu, a bieżący miesiąc nie jest zwracany.

    Jeśli to nie ty, zignoruj tę wiadomość. Nic nie zostanie usunięte.
workspace_deletion_scheduled:
  subject: '@site_name: Przestrzeń robocza "@workspace_name" zostanie usunięta @deletion_date'
  body: |
    Twoja przestrzeń robocza "@workspace_name" jest teraz offline. W dniu @deletion_date zostanie trwale usunięta wraz ze wszystkimi zgłoszeniami, stronami, kategoriami, statusami i brandingiem.

    Zmiana decyzji? Napisz na @support_email przed @deletion_date, a przywrócimy przestrzeń roboczą.
workspace_deletion_scheduled_paid:
  body: |
    Twoja subskrypcja zakończyła się. Bieżący miesiąc nie jest zwracany.
