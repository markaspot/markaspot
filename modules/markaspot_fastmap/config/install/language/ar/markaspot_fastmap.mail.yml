langcode: ar
workspace_verification:
  subject: '@site_name: قم بتأكيد مساحة العمل الخاصة بك "@workspace_name"'
  body: |
    لقد طلبت مساحة عمل جديدة: @workspace_name

    انقر على الرابط أدناه لتأكيد وتفعيل مساحة العمل الخاصة بك:
    @verify_url

    ستنتهي صلاحية هذا الرابط خلال @cleanup_days أيام.

    إذا لم تقم بهذا الطلب، يرجى تجاهل هذا البريد الإلكتروني.
workspace_welcome:
  subject: '@site_name: مساحة العمل "@workspace_name" جاهزة الآن'
  body: |
    مساحة العمل الخاصة بك "@workspace_name" أصبحت الآن نشطة:
    @workspace_url

    جرّبها الآن: أنشئ أول بلاغ تجريبي مباشرة على الخريطة.
    توجد بالفعل بعض البلاغات التجريبية. يمكنك تعديلها أو حذفها في أي وقت.

    أدر البلاغات الواردة من لوحة التحكم الخاصة بك:
    @workspace_url/dashboard

    سجّل الدخول في أي وقت: @workspace_url/auth/login
