markaspot_fastmap.settings:
  type: config_object
  label: 'FastMap workspace settings'
  mapping:
    service_key:
      type: string
      label: 'Service API key for workspace creation'
    cleanup_days:
      type: integer
      label: 'Days after which unverified pending requests are cleaned up'
    workspace_base_url:
      type: string
      label: 'Base URL template for new workspaces'
    verify_base_url:
      type: string
      label: 'Public base URL for verification links'
    mail_from:
      type: string
      label: 'From address for verification emails'
    demo_expiry_days:
      type: integer
      label: 'Days after which demo workspaces are auto-deleted'
    checkout_grace_days:
      type: integer
      label: 'Checkout grace period in days'
    deletion_grace_days:
      type: integer
      label: 'Days between a confirmed workspace deletion and the teardown'
    support_email:
      type: string
      label: 'Support address named in workspace deletion mails'
    tier_limits:
      type: sequence
      label: 'Request limits per tier'
      sequence:
        type: mapping
        label: 'Tier limit'
        mapping:
          limit:
            type: integer
            label: 'Request limit (null for unlimited)'
            nullable: true
          period:
            type: string
            label: 'Count period (published, monthly, or total)'
    member_limits:
      type: sequence
      label: 'Member limits per tier'
      sequence:
        type: integer
        label: 'Maximum number of group members'
    assignable_roles:
      type: sequence
      label: 'Assignable invitation roles per tier'
      sequence:
        type: sequence
        label: 'Assignable role IDs'
        sequence:
          type: string
          label: 'Group role ID'
    ai_budgets:
      type: sequence
      label: 'Monthly AI analysis budgets per tier'
      sequence:
        type: integer
        label: 'Monthly AI analysis limit (0 = unlimited)'

markaspot_fastmap.mail:
  type: config_object
  label: 'FastMap workspace mail templates'
  mapping:
    langcode:
      type: string
      label: 'Language code'
    workspace_verification:
      type: mapping
      label: 'Workspace verification email'
      mapping:
        subject:
          type: text
          label: 'Email subject'
        body:
          type: text
          label: 'Email body'
    workspace_welcome:
      type: mapping
      label: 'Workspace welcome email'
      mapping:
        subject:
          type: text
          label: 'Email subject'
        body:
          type: text
          label: 'Email body'
    workspace_deletion_confirm:
      type: mapping
      label: 'Workspace deletion confirmation email'
      mapping:
        subject:
          type: text
          label: 'Email subject'
        body:
          type: text
          label: 'Email body'
    workspace_deletion_scheduled:
      type: mapping
      label: 'Workspace deletion scheduled email'
      mapping:
        subject:
          type: text
          label: 'Email subject'
        body:
          type: text
          label: 'Email body'
    workspace_deletion_scheduled_paid:
      type: mapping
      label: 'Workspace deletion scheduled email: paragraph for paid subscriptions'
      mapping:
        body:
          type: text
          label: 'Paragraph'
    workspace_deletion_operator:
      type: mapping
      label: 'Workspace deletion operator notification'
      mapping:
        subject:
          type: text
          label: 'Email subject'
        body:
          type: text
          label: 'Email body'
