services:
  logger.channel.markaspot_archive:
    parent: logger.channel_base
    arguments: ['markaspot_archive']

  markaspot_archive.archive:
    class: Drupal\markaspot_archive\ArchiveService
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@state'
      - '@logger.channel.markaspot_archive'
      - '@database'
