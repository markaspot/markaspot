tax_status: service_status
status_archivable:
  6: '6'
status_archived: '6'
unpublish: 1
anonymize: 1
anonymize_fields:
  field_e_mail: field_e_mail
  field_first_name: field_first_name
  field_last_name: field_last_name
  field_phone: field_phone
  field_notification: field_notification
## Toggle automatic archiving on cron and its interval.
cron_enable: 1
cron_always_run: 0
cron_interval: 86400
default_days: 30
