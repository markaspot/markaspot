markaspot_moderation.submit_flag:
  path: '/api/moderation/flags'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::submitFlag'
    _title: 'Submit Flag'
  methods: [POST]
  requirements:
    _permission: 'submit flags'
  options:
    _format: 'json'

markaspot_moderation.flagged_requests:
  path: '/api/moderation/flagged-requests'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::getFlaggedRequests'
    _title: 'Flagged Requests'
  methods: [GET]
  requirements:
    _permission: 'administer flags'
  options:
    _format: 'json'

markaspot_moderation.flagged_count:
  path: '/api/moderation/flagged-requests/count'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::getFlaggedCount'
    _title: 'Flagged Request Count'
  methods: [GET]
  requirements:
    _permission: 'administer flags'
  options:
    _format: 'json'

markaspot_moderation.flags_for_request:
  path: '/api/moderation/flags/{nid}'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::getFlagsForRequest'
    _title: 'Flags for Request'
  methods: [GET]
  requirements:
    _permission: 'administer flags'
    nid: \d+
  options:
    _format: 'json'

markaspot_moderation.dismiss_flags:
  path: '/api/moderation/flags/{nid}/dismiss'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::dismissFlags'
    _title: 'Dismiss Flags'
  methods: [POST]
  requirements:
    _permission: 'administer flags'
    nid: \d+
  options:
    _format: 'json'

markaspot_moderation.hide_request:
  path: '/api/moderation/flags/{nid}/hide'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::hideRequest'
    _title: 'Hide Request'
  methods: [POST]
  requirements:
    _permission: 'administer flags'
    nid: \d+
  options:
    _format: 'json'

markaspot_moderation.delete_request:
  path: '/api/moderation/flags/{nid}'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationController::deleteRequest'
    _title: 'Delete Request'
  methods: [DELETE]
  requirements:
    _permission: 'administer all flags'
    nid: \d+
  options:
    _format: 'json'

markaspot_moderation.settings:
  path: '/admin/config/markaspot/moderation'
  defaults:
    _form: '\Drupal\markaspot_moderation\Form\ModerationSettingsForm'
    _title: 'Moderation Settings'
  requirements:
    _permission: 'administer all flags'
  options:
    _admin_route: TRUE

markaspot_moderation.admin:
  path: '/admin/content/moderation-flags'
  defaults:
    _controller: '\Drupal\markaspot_moderation\Controller\ModerationAdminController::adminOverview'
    _title: 'Flagged Content'
  requirements:
    _permission: 'administer flags'
  options:
    _admin_route: TRUE

markaspot_moderation.admin_dismiss:
  path: '/admin/content/moderation-flags/{nid}/dismiss'
  defaults:
    _form: '\Drupal\markaspot_moderation\Form\DismissFlagsConfirmForm'
    _title: 'Dismiss Flags'
  requirements:
    _permission: 'administer flags'
    nid: \d+
  options:
    _admin_route: TRUE

markaspot_moderation.admin_hide:
  path: '/admin/content/moderation-flags/{nid}/hide'
  defaults:
    _form: '\Drupal\markaspot_moderation\Form\HideRequestConfirmForm'
    _title: 'Hide Request'
  requirements:
    _permission: 'administer flags'
    nid: \d+
  options:
    _admin_route: TRUE

markaspot_moderation.admin_delete:
  path: '/admin/content/moderation-flags/{nid}/delete'
  defaults:
    _form: '\Drupal\markaspot_moderation\Form\DeleteRequestConfirmForm'
    _title: 'Delete Request'
  requirements:
    _permission: 'administer all flags'
    nid: \d+
  options:
    _admin_route: TRUE
