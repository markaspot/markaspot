services:
  logger.channel.markaspot_passwordless:
    parent: logger.channel_base
    arguments: ['markaspot_passwordless']

  markaspot_passwordless.otp:
    class: Drupal\markaspot_passwordless\Service\OtpService
    arguments:
      - '@database'
      - '@plugin.manager.mail'
      - '@current_user'
      - '@logger.channel.markaspot_passwordless'
      - '@config.factory'
      - '@entity_type.manager'
      - '@language_manager'
      - '@module_handler'
      - '@entity.repository'

  markaspot_passwordless.break_glass_otp:
    class: Drupal\markaspot_passwordless\Service\BreakGlassOtpService
    arguments:
      - '@state'
      - '@entity_type.manager'
      - '@keyvalue.expirable'
      - '@lock'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@logger.channel.markaspot_passwordless'
