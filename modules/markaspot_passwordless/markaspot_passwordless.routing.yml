markaspot_passwordless.request_code:
  path: '/api/auth/request-code'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::requestCode'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

markaspot_passwordless.verify_code:
  path: '/api/auth/verify-code'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::verifyCode'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

markaspot_passwordless.logout:
  path: '/api/auth/logout'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::logout'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

markaspot_passwordless.user_status:
  path: '/api/auth/status'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::status'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

markaspot_passwordless.switch_user:
  path: '/api/auth/switch-user'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::switchUser'
  methods: [POST]
  requirements:
    _permission: 'switch users'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_passwordless.switch_users_list:
  path: '/api/auth/switch-users'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::listSwitchUsers'
  methods: [GET]
  requirements:
    _permission: 'switch users'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_passwordless.switch_token:
  path: '/api/auth/switch-token'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::generateSwitchToken'
  methods: [POST]
  requirements:
    _permission: 'switch users'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_passwordless.claim_token:
  path: '/api/auth/claim-token'
  defaults:
    _controller: '\Drupal\markaspot_passwordless\Controller\PasswordlessAuthController::claimSwitchToken'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie']
    no_cache: 'TRUE'

markaspot_passwordless.settings:
  path: '/admin/config/system/markaspot-passwordless'
  defaults:
    _form: '\Drupal\markaspot_passwordless\Form\PasswordlessSettingsForm'
    _title: 'Passwordless Authentication Settings'
  requirements:
    _permission: 'administer site configuration'
