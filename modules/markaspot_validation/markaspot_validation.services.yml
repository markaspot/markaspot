services:
  logger.channel.markaspot_validation:
    parent: logger.channel_base
    arguments: ['markaspot_validation']

  markaspot_validation.boundary_validator:
    class: Drupal\markaspot_validation\Service\BoundaryValidator
    arguments: ['@entity_type.manager', '@logger.channel.markaspot_validation']

  markaspot_validation.double_post_constraint_validator:
    class: Drupal\markaspot_validation\Plugin\Validation\Constraint\DoublePostConstraintValidator
    arguments: ['@datetime.time', '@request_stack', '@entity_type.manager', '@config.factory', '@current_user', '@?markaspot_nuxt.citizen_wording_resolver', '@language_manager']

  markaspot_validation.multiple_reports_constraint_validator:
    class: Drupal\markaspot_validation\Plugin\Validation\Constraint\MultipleReportsConstraintValidator
    arguments: ['@datetime.time', '@request_stack', '@entity_type.manager', '@config.factory', '@current_user', '@?markaspot_nuxt.citizen_wording_resolver', '@language_manager']

  markaspot_validation.default_location_constraint_validator:
    class: Drupal\markaspot_validation\Plugin\Validation\Constraint\DefaultLocationConstraintValidator
    arguments: ['@datetime.time', '@request_stack', '@entity_type.manager', '@config.factory', '@current_user']

  # Post-processes JSON:API 422 responses to forward the violation cause
  # (set via ConstraintViolationBuilder::setCause()) as JSON:API `meta` on
  # the matching error object. Core's normalizer is sealed off from third
  # parties via a namespace check in Drupal\jsonapi\Serializer\Serializer,
  # so we layer this on top with a response subscriber instead.
  markaspot_validation.violation_cause_response_subscriber:
    class: Drupal\markaspot_validation\EventSubscriber\ViolationCauseResponseSubscriber
    tags:
      - { name: event_subscriber }
