services:
  markaspot_icons.icon_api_route_subscriber:
    class: Drupal\markaspot_icons\Routing\IconApiRouteSubscriber
    tags:
      - { name: event_subscriber }

  markaspot_icons.migration:
    class: Drupal\markaspot_icons\IconMigrationService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@messenger'
      - '@?iconify_field.icon_resolver'
      - '@renderer'
      - '@cache.render'
