# Geolocation core library.

geolocation-nominatim-widget:
  version: VERSION
  js:
    geolocation_nominatim.maplibre.js:
      attributes:
        type: module
      preprocess: false
  css:
    theme:
      geolocation_nominatim.css: {}

leaflet:
  header: true
  js:
    /libraries/leaflet/dist/leaflet.js: {}
  css:
    component:
      /libraries/leaflet/dist/leaflet.css: {}

maplibre:
  css:
    component:
      /libraries/maplibre-gl/dist/maplibre-gl.css: {}

leaflet-geosearch:
  css:
    component:
      /libraries/leaflet-geosearch/dist/geosearch.css: {}
  js:
    /libraries/leaflet-geosearch/dist/bundle.min.js: {}
  dependencies:
    - geolocation_nominatim/geolocation-nominatim-widget
    - geolocation_nominatim/leaflet

leaflet.fullscreen:
  js:
    /libraries/leaflet-fullscreen/dist/Leaflet.fullscreen.min.js: {}
  css:
    component:
      /libraries/leaflet-fullscreen/dist/leaflet.fullscreen.css: {}
