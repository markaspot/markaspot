# Global Drupal maintenance switch. The public GET is deliberately tiny so
# Nuxt can render a central maintenance screen even while Core blocks regular
# JSON:API/Open311 traffic. PATCH remains a cookie + CSRF protected platform
# operation and both routes opt out of Core's blanket maintenance response so
# the platform can always switch the installation back on.
markaspot_dashboard.platform_maintenance_status:
  path: '/api/platform/maintenance'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\PlatformMaintenanceController::status'
    _title: 'Platform maintenance status'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    _format: 'json'
    _maintenance_access: TRUE
    no_cache: 'TRUE'

markaspot_dashboard.platform_maintenance_access:
  path: '/api/platform/maintenance/access'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\PlatformMaintenanceController::accessStatus'
    _title: 'Platform maintenance access status'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie']
    _format: 'json'
    _maintenance_access: TRUE
    no_cache: 'TRUE'

markaspot_dashboard.platform_maintenance_update:
  path: '/api/platform/maintenance'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\PlatformMaintenanceController::update'
    _title: 'Update platform maintenance mode'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_dashboard\Controller\PlatformMaintenanceController::access'
    _csrf_request_header_token: 'TRUE'
  options:
    _auth: ['cookie']
    _format: 'json'
    _maintenance_access: TRUE
    no_cache: 'TRUE'

# Split service request into a linked sibling (#512). Mutations follow the
# markaspot_group CSRF convention (_csrf_request_header_token + cookie auth);
# jurisdiction membership on the queried node is re-checked in the
# controller on top of the route permission (InboundMailAccessControlHandler
# pattern, #482).
markaspot_dashboard.request_split:
  path: '/api/dashboard/requests/{nid}/split'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\SplitController::split'
    _title: 'Split service request'
  methods: [POST]
  requirements:
    _permission: 'split service requests'
    _csrf_request_header_token: 'TRUE'
    nid: \d+
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_dashboard.request_links:
  path: '/api/dashboard/requests/{nid}/links'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\SplitController::links'
    _title: 'Linked service requests'
  methods: [GET]
  requirements:
    _permission: 'split service requests'
    nid: \d+
  options:
    _format: 'json'
    _auth: ['cookie']

# Mail-text editor API (Nuxt dashboard). Manages markaspot_mail.texts
# notification templates: read the catalog (texts + standard-key flags +
# generated token catalog), create/update a key, delete a custom key, and
# resolve tokens for the editor's live-preview panel. Mutations follow the
# SplitController CSRF convention (_csrf_request_header_token + cookie
# auth). The preview route is declared before the {key} routes so its
# literal path segment is never shadowed by the variable one.
#
# _permission and _custom_access are combined with AND by Drupal's access
# manager: staff still needs the role permission, and the jurisdiction still
# needs an enterprise tier (see EnterpriseFeatureAccessCheck). Only the
# editor is gated here — mail sending itself is never tier-gated.
markaspot_dashboard.mail_texts_catalog:
  path: '/api/dashboard/mail-texts'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\MailTextsController::catalog'
    _title: 'Mail text catalog'
  methods: [GET]
  requirements:
    _permission: 'administer markaspot mail texts'
    _custom_access: 'markaspot_nuxt.enterprise_feature_access_check:check'
  options:
    _format: 'json'
    _auth: ['cookie']
    _enterprise_feature: 'mail_text_editor'

markaspot_dashboard.mail_texts_preview:
  path: '/api/dashboard/mail-texts/preview'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\MailTextsController::preview'
    _title: 'Preview mail text tokens'
  methods: [POST]
  requirements:
    _permission: 'administer markaspot mail texts'
    _custom_access: 'markaspot_nuxt.enterprise_feature_access_check:check'
    _csrf_request_header_token: 'TRUE'
  options:
    _format: 'json'
    _auth: ['cookie']
    _enterprise_feature: 'mail_text_editor'

markaspot_dashboard.mail_texts_save:
  path: '/api/dashboard/mail-texts/{key}'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\MailTextsController::save'
    _title: 'Save mail text'
  methods: [PUT]
  requirements:
    _permission: 'administer markaspot mail texts'
    _custom_access: 'markaspot_nuxt.enterprise_feature_access_check:check'
    _csrf_request_header_token: 'TRUE'
  options:
    _format: 'json'
    _auth: ['cookie']
    _enterprise_feature: 'mail_text_editor'

markaspot_dashboard.mail_texts_delete:
  path: '/api/dashboard/mail-texts/{key}'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\MailTextsController::delete'
    _title: 'Delete mail text'
  methods: [DELETE]
  requirements:
    _permission: 'administer markaspot mail texts'
    _custom_access: 'markaspot_nuxt.enterprise_feature_access_check:check'
    _csrf_request_header_token: 'TRUE'
  options:
    _format: 'json'
    _auth: ['cookie']
    _enterprise_feature: 'mail_text_editor'

# Per-jurisdiction status selection. The pool is always owned by the tree root;
# child jurisdictions store only an optional subset. Access is session-based
# and scoped to tenant-admin membership of the requested group or its root.
markaspot_dashboard.status_selection_get:
  path: '/api/dashboard/status-selection/{group_id}'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\StatusSelectionController::getSelection'
    _title: 'Status selection'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_dashboard\Controller\StatusSelectionController::accessCheck'
    group_id: '\d+'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_dashboard.status_selection_patch:
  path: '/api/dashboard/status-selection/{group_id}'
  defaults:
    _controller: '\Drupal\markaspot_dashboard\Controller\StatusSelectionController::patchSelection'
    _title: 'Update status selection'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_dashboard\Controller\StatusSelectionController::accessCheck'
    _csrf_request_header_token: 'TRUE'
    group_id: '\d+'
  options:
    _format: 'json'
    _auth: ['cookie']
