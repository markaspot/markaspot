services:
  markaspot_dashboard.metrics_calculator:
    class: Drupal\markaspot_dashboard\Service\MetricsCalculatorService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@?markaspot_group.hierarchy_resolver'

  markaspot_dashboard.request_link:
    class: Drupal\markaspot_dashboard\Service\RequestLinkService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.markaspot_dashboard'

  markaspot_dashboard.split_request:
    class: Drupal\markaspot_dashboard\Service\SplitRequestService
    arguments:
      - '@entity_type.manager'
      - '@markaspot_open311.processor'
      - '@markaspot_dashboard.request_link'
      - '@logger.channel.markaspot_dashboard'
      - '@config.factory'
      - '@database'
      - '@?markaspot_group.hierarchy_resolver'

  markaspot_dashboard.mail_texts:
    class: Drupal\markaspot_dashboard\Service\MailTextsService
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@token'
      - '@logger.channel.markaspot_dashboard'
      - '@string_translation'

  logger.channel.markaspot_dashboard:
    parent: logger.channel_base
    arguments: ['markaspot_dashboard']
