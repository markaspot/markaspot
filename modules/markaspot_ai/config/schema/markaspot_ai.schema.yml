markaspot_ai.settings:
  type: config_object
  label: 'Mark-a-Spot AI settings'
  mapping:
    default_provider:
      type: string
      label: 'Default AI Provider'
      constraints:
        Choice:
          choices:
            - openai
            - azure
            - ionos
    providers:
      type: mapping
      label: 'AI Providers'
      mapping:
        openai:
          type: mapping
          label: 'OpenAI Configuration'
          mapping:
            api_key:
              type: string
              label: 'API Key'
            api_url:
              type: uri
              label: 'API URL'
            chat_model:
              type: string
              label: 'Chat Model'
            embedding_model:
              type: string
              label: 'Embedding Model'
            auth_type:
              type: string
              label: 'Authentication Type'
        azure:
          type: mapping
          label: 'Azure OpenAI Configuration'
          mapping:
            api_key:
              type: string
              label: 'API Key'
            api_url:
              type: string
              label: 'Azure Endpoint URL'
            api_version:
              type: string
              label: 'API Version'
            chat_model:
              type: string
              label: 'Chat Deployment Name'
            embedding_model:
              type: string
              label: 'Embedding Deployment Name'
            auth_type:
              type: string
              label: 'Authentication Type'
        ionos:
          type: mapping
          label: 'IONOS AI Configuration'
          mapping:
            api_key:
              type: string
              label: 'API Key'
            api_url:
              type: uri
              label: 'API URL'
            chat_model:
              type: string
              label: 'Chat Model'
            embedding_model:
              type: string
              label: 'Embedding Model'
            auth_type:
              type: string
              label: 'Authentication Type'
    ai_processing:
      type: mapping
      label: 'AI Processing Settings'
      mapping:
        auto_backfill:
          type: boolean
          label: 'Enable Automatic Backfill'
    duplicate_detection:
      type: mapping
      label: 'Duplicate Detection Settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable Duplicate Detection'
        similarity_threshold:
          type: float
          label: 'Similarity Threshold'
        radius_meters:
          type: integer
          label: 'Search Radius (meters)'
        time_window_days:
          type: integer
          label: 'Time Window (days)'
        auto_flag:
          type: boolean
          label: 'Auto-flag Duplicates'
    token_tracking:
      type: mapping
      label: 'Token Tracking Settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable Token Tracking'
        daily_limit:
          type: integer
          label: 'Daily Token Limit'
        alert_threshold:
          type: float
          label: 'Alert Threshold'
    sentiment_analysis:
      type: mapping
      label: 'Sentiment Analysis Settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable Sentiment Analysis'
        model:
          type: string
          label: 'Model for Sentiment Analysis'
    pii_redaction:
      type: mapping
      label: 'PII Redaction Settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable PII Redaction'
        use_llm:
          type: boolean
          # Deprecated: renamed to detect_names. Retained in the schema
          # until the next release so legacy active config does not fail
          # validation during the upgrade window.
          label: 'Use LLM for Name Detection (deprecated, use detect_names)'
        detect_names:
          type: boolean
          label: 'Detect Names via Provider'
        provider:
          type: string
          label: 'AI Provider for PII Detection'
          constraints:
            Choice:
              choices:
                - openai
                - azure
                - ionos
                - local_nlp
    nlp_service:
      type: mapping
      label: 'Self-Hosted NLP Service'
      mapping:
        enabled:
          type: boolean
          label: 'Enable Self-Hosted NLP Service'
        url:
          type: uri
          label: 'NLP Service Base URL'
        api_key:
          type: string
          label: 'Bearer Token (legacy/test only — production uses MARKASPOT_NLP_API_KEY env var)'
        health_check_interval:
          type: integer
          label: 'Health Check Interval (seconds)'
