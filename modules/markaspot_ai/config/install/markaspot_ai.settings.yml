default_provider: openai
providers:
  openai:
    api_key: ''
    api_url: 'https://api.openai.com/v1'
    chat_model: 'gpt-4.1-mini'
    embedding_model: 'text-embedding-3-large'
    auth_type: 'bearer'
  azure:
    api_key: ''
    api_url: ''
    api_version: '2024-12-01-preview'
    chat_model: 'gpt-4.1-mini'
    embedding_model: 'text-embedding-3-large'
    auth_type: 'api_key_header'
  ionos:
    api_key: ''
    api_url: 'https://openai.inference.de-txl.ionos.com/v1'
    chat_model: 'mistralai/Mistral-Nemo-Instruct-2407'
    embedding_model: 'BAAI/bge-m3'
    auth_type: 'bearer'
ai_processing:
  auto_backfill: false
duplicate_detection:
  enabled: false
  similarity_threshold: 0.85
  radius_meters: 500
  time_window_days: 30
  auto_flag: false
token_tracking:
  enabled: true
  daily_limit: 100000
  alert_threshold: 0.9
sentiment_analysis:
  enabled: false
  model: 'gpt-4.1-mini'
pii_redaction:
  enabled: false
  detect_names: false
  provider: 'ionos'
nlp_service:
  enabled: false
  url: 'http://markaspot-nlp:8100'
  health_check_interval: 300
