services:
  markaspot_ai.client:
    class: Drupal\markaspot_ai\Service\AiClientService
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'
      - '@markaspot_ai.token_tracking'

  markaspot_ai.embedding:
    class: Drupal\markaspot_ai\Service\EmbeddingService
    arguments:
      - '@markaspot_ai.client'
      - '@database'
      - '@entity_type.manager'
      - '@logger.factory'

  markaspot_ai.duplicate_detection:
    class: Drupal\markaspot_ai\Service\DuplicateDetectionService
    arguments:
      - '@markaspot_ai.embedding'
      - '@database'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@?markaspot_group.hierarchy_resolver'

  markaspot_ai.token_tracking:
    class: Drupal\markaspot_ai\Service\TokenTrackingService
    arguments:
      - '@database'
      - '@config.factory'
      - '@logger.factory'

  markaspot_ai.sentiment:
    class: Drupal\markaspot_ai\Service\SentimentService
    arguments:
      - '@markaspot_ai.client'
      - '@database'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@markaspot_ai.token_tracking'
      - '@datetime.time'
      - '@module_handler'
      - '@?markaspot_group.hierarchy_resolver'

  markaspot_ai.attribute_filling:
    class: Drupal\markaspot_ai\Service\AttributeFillingService
    arguments:
      - '@markaspot_ai.client'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@markaspot_ai.token_tracking'
      - '@file_system'
      - '@language_manager'
      - '@database'
      - '@?markaspot_group.hierarchy_resolver'

  markaspot_ai.risk_score_calculator:
    class: Drupal\markaspot_ai\Service\RiskScoreCalculator
    arguments:
      - '@config.factory'

  markaspot_ai.node_analysis:
    class: Drupal\markaspot_ai\Service\NodeAnalysisService
    arguments:
      - '@markaspot_ai.client'
      - '@markaspot_ai.sentiment'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@markaspot_ai.token_tracking'
      - '@markaspot_ai.risk_score_calculator'
      - '@database'

  markaspot_ai.spam_risk_scanner:
    class: Drupal\markaspot_ai\Service\SpamRiskScannerService
    arguments:
      - '@entity_type.manager'
      - '@markaspot_ai.client'
      - '@datetime.time'
      - '@markaspot_nuxt.feature_scope_resolver'
      - '@logger.factory'

  markaspot_ai.nlp_client:
    class: Drupal\markaspot_ai\Service\NlpClientService
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'

  logger.channel.markaspot_ai:
    parent: logger.channel_base
    arguments: ['markaspot_ai']
