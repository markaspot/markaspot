services:
  logger.channel.markaspot_mail:
    parent: logger.channel_base
    arguments: ['markaspot_mail']

  markaspot_mail.branding:
    class: Drupal\markaspot_mail\Service\MailBrandingService
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@language_manager'
      - '@file_url_generator'
      - '@logger.channel.markaspot_mail'
      - '@extension.list.module'
      - '@request_stack'
      - '@file_system'

  markaspot_mail.renderer:
    class: Drupal\markaspot_mail\Service\MailHtmlRenderer
    arguments:
      - '@renderer'
      - '@markaspot_mail.branding'
      - '@logger.channel.markaspot_mail'

  # Gates file-/image-reference fields into MailAttachment DTOs. Builders
  # that opt into shipping report files (escalation, moderation, ECA
  # opt-in) inject this service. MIME whitelist + size caps live in
  # markaspot_mail.settings:attachments.*, not here, so operators can
  # tighten the policy without touching code. Private: only consumed by
  # in-bundle builders; external modules should add their own builder
  # instead of calling this service directly.
  markaspot_mail.attachment_resolver:
    class: Drupal\markaspot_mail\Service\AttachmentResolver
    public: false
    arguments:
      - '@config.factory'
      - '@logger.channel.markaspot_mail'

  # Collects every service tagged markaspot_mail.builder. Individual builders
  # land in Stage 2 (ECA), Stage 3 (FastMap) and Stage 4 (passwordless OTP).
  # The registry is instantiated even when no builders are tagged; in that
  # case the hook dispatcher simply finds no match and returns early.
  # Private: only MailAlterHook consumes this service.
  markaspot_mail.builder_registry:
    class: Drupal\markaspot_mail\Mail\MailBuilderRegistry
    public: false
    arguments:
      - !tagged_iterator markaspot_mail.builder

  markaspot_mail.mail_alter_hook:
    class: Drupal\markaspot_mail\Hook\MailAlterHook
    arguments:
      - '@markaspot_mail.builder_registry'
      - '@markaspot_mail.branding'
      - '@markaspot_mail.renderer'
      - '@logger.channel.markaspot_mail'

  # Non-prod recipient fence (markaspot-ui#388, defense layer L3). Reads the
  # markaspot_mail_recipient_override settings key (env-fed, never config/DB)
  # and redirects every outgoing mail when set. Runs unconditionally for all
  # mails, after the branding hook.
  markaspot_mail.recipient_override_hook:
    class: Drupal\markaspot_mail\Hook\RecipientOverrideHook
    arguments:
      - '@logger.channel.markaspot_mail'

  # Stage 2 ECA builders. Each claims a single ($module, $key) pair via
  # supports(). Adding a new ECA mail = adding a class + a tag here; no
  # changes to MailAlterHook or the registry.
  markaspot_mail.builder.feedback_request:
    class: Drupal\markaspot_mail\Mail\Builder\FeedbackRequestBuilder
    arguments:
      - '@markaspot_mail.branding'
      - '@config.factory'
      - '@language_manager'
      - '@token'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.group_member_invitation:
    class: Drupal\markaspot_mail\Mail\Builder\GroupMemberInvitationBuilder
    arguments:
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.eca_action_email:
    class: Drupal\markaspot_mail\Mail\Builder\EcaActionEmailBuilder
    arguments:
      - '@logger.channel.markaspot_mail'
      - '@markaspot_mail.attachment_resolver'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.workspace_verification:
    class: Drupal\markaspot_mail\Mail\Builder\WorkspaceVerificationBuilder
    arguments:
      - '@config.factory'
      - '@language_manager'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.workspace_welcome:
    class: Drupal\markaspot_mail\Mail\Builder\WorkspaceWelcomeBuilder
    arguments:
      - '@config.factory'
      - '@language_manager'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.demo_expiry_reminder:
    class: Drupal\markaspot_mail\Mail\Builder\DemoExpiryReminderBuilder
    arguments:
      - '@config.factory'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.passwordless_otp:
    class: Drupal\markaspot_mail\Mail\Builder\PasswordlessOtpBuilder
    arguments:
      - '@config.factory'
      - '@language_manager'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.escalation_notification:
    class: Drupal\markaspot_mail\Mail\Builder\EscalationNotificationBuilder
    arguments:
      - '@logger.channel.markaspot_mail'
      - '@markaspot_mail.attachment_resolver'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.resubmission_request:
    class: Drupal\markaspot_mail\Mail\Builder\ResubmissionRequestBuilder
    arguments:
      - '@config.factory'
      - '@language_manager'
      - '@token'
      - '@logger.channel.markaspot_mail'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.moderation_notice:
    class: Drupal\markaspot_mail\Mail\Builder\ModerationNoticeBuilder
    arguments:
      - '@logger.channel.markaspot_mail'
      - '@markaspot_mail.attachment_resolver'
    tags:
      - { name: markaspot_mail.builder }

  markaspot_mail.builder.group_org_notification:
    class: Drupal\markaspot_mail\Mail\Builder\GroupOrgNotificationBuilder
    arguments:
      - '@logger.channel.markaspot_mail'
      - '@markaspot_mail.branding'
    tags:
      - { name: markaspot_mail.builder }
