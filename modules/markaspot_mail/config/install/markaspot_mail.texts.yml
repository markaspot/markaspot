langcode: en
report_confirmation:
  subject: 'Your {{ citizen_term_singular }} #[node:request_id] has been received'
  headline: 'We received your {{ citizen_term_singular }}'
  intro: 'Your {{ citizen_term_singular }} #[node:request_id] has been received.'
  body_blocks:
    - 'Category: [node:field_category:entity:name]'
    - '[node:initial_status_note]'
  cta_label: 'View your {{ citizen_term_singular }}'
  preheader: 'We received your {{ citizen_term_singular }} and will keep you updated.'
status_open:
  subject: 'Update on your {{ citizen_term_singular }} #[node:request_id]'
  headline: 'Your {{ citizen_term_singular }} is being processed'
  intro: 'Thank you for your {{ citizen_term_singular }}. It has been forwarded to the responsible department and is now being processed.'
  body_blocks:
    - 'You will receive another notification once it has been resolved.'
  cta_label: 'View your {{ citizen_term_singular }}'
  preheader: 'Your {{ citizen_term_singular }} is now being processed.'
status_closed:
  subject: 'Your {{ citizen_term_singular }} #[node:request_id] has been resolved'
  headline: 'Your {{ citizen_term_singular }} has been resolved'
  intro: 'Good news! Your {{ citizen_term_singular }} #[node:request_id] has been resolved.'
  body_blocks:
    - 'If your matter is an urgent emergency or poses an immediate threat, please contact the police (110) or the fire department (112) directly.'
  cta_label: 'View your {{ citizen_term_singular }}'
  preheader: 'Your {{ citizen_term_singular }} has been resolved.'
status_not_responsible:
  subject: 'Your {{ citizen_term_singular }} #[node:request_id]: not our responsibility'
  headline: 'We are not responsible for this {{ citizen_term_singular }}'
  intro: 'Your {{ citizen_term_singular }} #[node:request_id] has been reviewed. Unfortunately, we are not responsible for this type of request.'
  body_blocks:
    - 'If your matter is an urgent emergency or poses an immediate threat, please contact the police (110) or the fire department (112) directly.'
  cta_label: 'View your {{ citizen_term_singular }}'
  preheader: 'We are not responsible for this {{ citizen_term_singular }}.'
