markaspot_mail.settings:
  type: config_object
  label: 'Mark-a-Spot Mail settings'
  mapping:
    platform:
      type: mapping
      label: 'Platform-level branding defaults'
      mapping:
        name:
          type: string
          label: 'Platform name'
        support_email:
          type: string
          label: 'Platform support email'
        reply_to:
          type: string
          label: 'Platform Reply-To header'
        logo_path:
          type: string
          label: 'Platform logo (module-relative path)'
        primary_color:
          type: string
          label: 'Platform primary color (Tailwind name or #RRGGBB)'
        background_color:
          type: string
          label: 'Platform background color (Tailwind name or #RRGGBB)'
        legal_notice_url:
          type: string
          label: 'Platform legal notice URL (Impressum)'
        privacy_url:
          type: string
          label: 'Platform privacy policy URL'
        frontend_base_url:
          type: string
          label: 'Platform frontend base URL'
        tenant_frontend_base_template:
          type: string
          label: 'Tenant frontend base URL template (must contain the {slug} placeholder)'
        backend_base_url:
          type: string
          label: 'Public origin of this Drupal install for mail assets and generated URLs. When empty, already public URLs are preserved and internal URLs fall back to relative paths. Operators set this via settings.php from an environment variable.'
    features:
      type: mapping
      label: 'Feature flags'
      mapping:
        show_platform_footer:
          type: boolean
          label: 'Always render the Platform Zone-2 footer'
        tier_gating:
          type: boolean
          label: 'Hide the Platform footer on paid tiers (future stage)'
    recipient_flood:
      type: mapping
      label: 'Per-recipient notification flood control'
      mapping:
        limit:
          type: integer
          label: 'Maximum notifications per recipient and window'
        window:
          type: integer
          label: 'Flood-control window in seconds'
    attachments:
      type: mapping
      label: 'File-attachment policy for outgoing mails'
      mapping:
        enabled:
          type: boolean
          label: 'Master switch for mail attachments'
        max_per_file_bytes:
          type: integer
          label: 'Per-file size cap in bytes'
        max_total_bytes:
          type: integer
          label: 'Total-size budget per mail in bytes'
        allowed_mime:
          type: sequence
          label: 'Whitelisted MIME types (empty list means MIME gate disabled; use "enabled: false" to block attachments outright)'
          sequence:
            type: string
            label: 'MIME type'

markaspot_mail.texts:
  type: config_object
  label: 'Mark-a-Spot notification mail texts'
  mapping:
    langcode:
      type: string
      label: 'Language code'
    report_confirmation:
      type: markaspot_mail.texts.slot_set
      label: 'Report confirmation'
    status_open:
      type: markaspot_mail.texts.slot_set
      label: 'Status update: open / in progress'
    status_closed:
      type: markaspot_mail.texts.slot_set
      label: 'Status update: closed'
    status_not_responsible:
      type: markaspot_mail.texts.slot_set
      label: 'Status update: not responsible'

# Schema for the markaspot_mail_send_notification ECA action plugin's
# configuration, keyed by Drupal core's action.configuration.[%parent.plugin]
# dynamic type (see core.entity.schema.yml's action_send_email_action entry
# for the pattern this mirrors). Without this entry, config saved through
# the ECA editor or the markaspot:mail-texts-migrate drush command has no
# typed schema to validate against.
action.configuration.markaspot_mail_send_notification:
  type: mapping
  label: 'Send notification email (Mark-a-Spot) configuration'
  mapping:
    object:
      type: string
      label: 'ECA token name of the acted-upon entity'
    notification_key:
      type: string
      label: 'Notification key'
    recipient:
      type: string
      label: 'Recipient email address'

markaspot_mail.texts.slot_set:
  type: mapping
  label: 'Notification mail text slots'
  mapping:
    subject:
      type: label
      label: 'Subject'
    headline:
      type: label
      label: 'Headline'
    intro:
      type: text
      label: 'Intro paragraph'
    body_blocks:
      type: sequence
      label: 'Body paragraphs'
      sequence:
        type: text
        label: 'Paragraph'
    cta_label:
      type: label
      label: 'Call-to-action label'
    preheader:
      type: label
      label: 'Preheader (inbox preview text)'
