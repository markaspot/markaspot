markaspot_geocoder.settings:
  type: config_object
  label: 'Mark-a-Spot Geocoder settings'
  mapping:
    provider:
      type: string
      label: 'Geocoding provider'
    language:
      type: string
      label: 'Language code'
    mapbox_token:
      type: string
      label: 'Mapbox access token'
    district_mappings:
      type: sequence
      label: 'District taxonomy mappings'
      sequence:
        type: mapping
        mapping:
          geocoder_properties:
            type: sequence
            label: 'Geocoder property fallback chain'
            sequence:
              type: string
          field:
            type: string
            label: 'Target entity reference field'
          vocabulary:
            type: string
            label: 'Target taxonomy vocabulary'
          auto_create:
            type: boolean
            label: 'Auto-create terms'
