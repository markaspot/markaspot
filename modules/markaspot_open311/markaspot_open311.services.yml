services:
  markaspot_open311.log_redactor:
    class: Drupal\markaspot_open311\Logger\LogRedactor

  markaspot_open311.logger.dblog_redacting:
    class: Drupal\markaspot_open311\Logger\RedactingLoggerDecorator
    decorates: logger.dblog
    decoration_on_invalid: ignore
    arguments:
      - '@markaspot_open311.logger.dblog_redacting.inner'
      - '@markaspot_open311.log_redactor'

  markaspot_open311.logger.syslog_redacting:
    class: Drupal\markaspot_open311\Logger\RedactingLoggerDecorator
    decorates: logger.syslog
    decoration_on_invalid: ignore
    arguments:
      - '@markaspot_open311.logger.syslog_redacting.inner'
      - '@markaspot_open311.log_redactor'

  markaspot_open311.status_classifier:
    class: Drupal\markaspot_open311\Service\StatusClassifier
    arguments: ['@config.factory', '@entity_type.manager', '@cache.default']

  markaspot_open311.serializer.encoder.xml:
    class: Drupal\markaspot_open311\Encoder\Open311Encoder
    tags:
      - { name: encoder, format: xml }

  markaspot_open311.handler.georeport_request:
    class: Drupal\markaspot_open311\GeoreportRequestHandler
    arguments: ['@serializer', '@path.current', '@config.factory']

  markaspot_open311.serializer.encoder.form:
    class: Drupal\markaspot_open311\Encoder\Open311Encoder
    tags:
      - { name: encoder, format: form }

  markaspot_open311.processor:
    class: Drupal\markaspot_open311\Service\GeoreportProcessorService
    arguments: ['@config.factory', '@current_user', '@datetime.time', '@request_stack', '@entity_type.manager', '@file_url_generator', '@module_handler', '@entity_field.manager', '@stream_wrapper_manager', '@token', '@language_manager', '@database', '@file_system', '@http_client', '@messenger', '@account_switcher', '@markaspot_open311.status_classifier', '@markaspot_group.hierarchy_resolver', '@logger.channel.markaspot_open311', '@keyvalue']

  markaspot_open311.georeport_processor:
    alias: markaspot_open311.processor
    public: true

  markaspot_open311.search_api_query:
    class: Drupal\markaspot_open311\Service\SearchApiQueryService
    arguments: ['@entity_type.manager', '@module_handler', '@config.factory', '@logger.channel.markaspot_open311']

  logger.channel.markaspot_open311:
    parent: logger.channel_base
    arguments: ['markaspot_open311']

  markaspot_open311.georeport_event.subscriber:
    class: Drupal\markaspot_open311\EventSubscriber\GeoreportEventSubscriber
    arguments: [ '@serializer', '@path.current']
    tags:
      - { name: event_subscriber }
  markaspot_open311.request_format_subscriber:
    class: Drupal\markaspot_open311\EventSubscriber\RequestFormatSubscriber
    tags:
      - { name: event_subscriber }
  markaspot_open311.event_subscriber:
    class: Drupal\markaspot_open311\EventSubscriber\RemoveCookieSubscriber
    arguments: ['@messenger']
    tags:
      - { name: event_subscriber }
  markaspot_open311.cache_subscriber:
    class: Drupal\markaspot_open311\EventSubscriber\GeoreportCacheSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }
