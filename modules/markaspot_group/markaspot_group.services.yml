services:
  logger.channel.markaspot_group:
    parent: logger.channel_base
    arguments: ['markaspot_group']
  markaspot_group.hierarchy_resolver:
    class: Drupal\markaspot_group\Service\JurisdictionHierarchyResolver
    arguments: ['@entity_type.manager', '@database', '@logger.factory', '@config.factory']
  markaspot_group.organisation_hierarchy_resolver:
    class: Drupal\markaspot_group\Service\JurisdictionHierarchyResolver
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.factory'
      - '@config.factory'
      - 'closed'
      - true
  markaspot_group.organisation_management_access:
    class: Drupal\markaspot_group\Service\OrganisationManagementAccess
    arguments: ['@markaspot_group.organisation_hierarchy_resolver', '@config.factory']
  markaspot_group.organisation_management_permission_calculator:
    class: Drupal\markaspot_group\Service\OrganisationManagementPermissionCalculator
    arguments: ['@markaspot_group.organisation_management_access', '@entity_type.manager']
    tags:
      - { name: flexible_permission_calculator, priority: -90 }
  markaspot_group.entity_storage_exception_subscriber:
    class: Drupal\markaspot_group\EventSubscriber\EntityStorageExceptionSubscriber
    tags:
      - { name: event_subscriber }
  markaspot_group.org_hierarchy_resolver:
    class: Drupal\markaspot_group\Service\OrgHierarchyResolver
    arguments: ['@entity_type.manager', '@database', '@logger.factory']
  markaspot_group.organisation_metadata_builder:
    class: Drupal\markaspot_group\Service\OrganisationMetadataBuilder
    arguments: ['@entity_type.manager', '@markaspot_group.org_hierarchy_resolver']
  markaspot_group.integrity_checker:
    class: Drupal\markaspot_group\Service\GroupIntegrityChecker
    arguments: ['@database', '@entity_type.manager', '@config.factory']
  markaspot_group.jurisdiction_scope_validator:
    class: Drupal\markaspot_group\Service\JurisdictionScopeValidator
    arguments: ['@database', '@logger.channel.markaspot_group', '@config.factory']
  markaspot_group.status_term_scope:
    class: Drupal\markaspot_group\Service\StatusTermScope
    arguments: ['@entity_type.manager', '@entity_field.manager', '@markaspot_group.hierarchy_resolver']
  markaspot_group.status_term_seed_planner:
    class: Drupal\markaspot_group\Service\StatusTermSeedPlanner
