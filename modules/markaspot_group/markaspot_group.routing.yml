markaspot_group.members_matrix:
  path: '/api/group-members'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupMembersController::getMatrix'
    _title: 'Group Members Matrix'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupMembersController::accessCheck'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.admin_jurisdictions:
  path: '/api/admin/jurisdictions'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupMembersController::listAdminJurisdictions'
    _title: 'Admin Jurisdictions'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupMembersController::platformAdminAccessCheck'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.request_assignees:
  path: '/api/request-assignees/{node}'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\RequestAssigneesController::assignees'
    _title: 'Service Request Assignees'
  methods: [GET]
  requirements:
    _permission: 'assign service requests'
    _entity_access: 'node.view'
    _format: 'json'
  options:
    _auth: ['cookie']

markaspot_group.request_responsibility_update:
  path: '/api/request-responsibility/{node}'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\RequestResponsibilityController::update'
  methods: [PATCH]
  requirements:
    _entity_access: 'node.update'
    _csrf_request_header_token: 'TRUE'
    node: \d+
  options:
    _format: 'json'
    _auth: ['cookie']
    parameters:
      node:
        type: entity:node

markaspot_group.member_update:
  path: '/api/group-members/{uid}'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupMembersController::updateMemberships'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupMembersController::accessCheck'
    _csrf_request_header_token: 'TRUE'
    uid: \d+
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.member_detail:
  path: '/api/group-members/{uid}/detail'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupMembersController::getUserDetail'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupMembersController::accessCheck'
    uid: \d+
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.member_profile_update:
  path: '/api/group-members/{uid}/profile'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupMembersController::updateUserProfile'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupMembersController::accessCheck'
    _csrf_request_header_token: 'TRUE'
    uid: \d+
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.integrity_health:
  path: '/api/admin/health/group-integrity'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupIntegrityHealthController::checks'
    _title: 'Group integrity health'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupIntegrityHealthController::access'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.invitation_send:
  path: '/api/group-members/invite'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupInvitationController::invite'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupInvitationController::accessCheck'
    _csrf_request_header_token: 'TRUE'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.invitation_list:
  path: '/api/group-members/invitations'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupInvitationController::listInvitations'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupInvitationController::accessCheck'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.invitation_revoke:
  path: '/api/group-members/invitations/{invitation_id}'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupInvitationController::revokeInvitation'
  methods: [DELETE]
  requirements:
    _custom_access: '\Drupal\markaspot_group\Controller\GroupInvitationController::accessCheck'
    invitation_id: \d+
    _csrf_request_header_token: 'TRUE'
  options:
    _format: 'json'
    _auth: ['cookie']

markaspot_group.invitation_claim:
  path: '/api/group-members/claim/{token}'
  defaults:
    _controller: '\Drupal\markaspot_group\Controller\GroupInvitationController::claimInvitation'
  methods: [POST]
  requirements:
    _access: 'TRUE'
    token: '[a-f0-9]{64}'
  options:
    _format: 'json'
