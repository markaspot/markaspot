langcode: en
status: true
dependencies:
  config:
    - field.field.node.service_request.field_e_mail
    - field.field.node.service_request.field_notification
    - field.storage.node.field_e_mail
    - field.storage.node.field_notification
    - node.type.service_request
  module:
    - eca_content
    - markaspot_mail
    - modeler_api
third_party_settings:
  modeler_api:
    modeler_id: fallback
    label: 'Confirm Report'
    version: '1.0'
id: process_confirm_report
weight: 10
template: null
events:
  Event_confirm_insert:
    plugin: 'content_entity:insert'
    label: 'Service Request Created'
    configuration:
      type: 'node service_request'
    successors:
      -
        id: Activity_send_confirmation
        condition: Condition_notification_enabled
conditions:
  Condition_notification_enabled:
    plugin: eca_entity_field_value
    configuration:
      expected_value: '1'
      field_name: field_notification.value
      operator: equal
      type: value
      case: true
      negate: false
      entity: ''
gateways: {  }
actions:
  Activity_send_confirmation:
    plugin: markaspot_mail_send_notification
    label: 'Send Confirmation Email'
    configuration:
      object: entity
      notification_key: report_confirmation
      recipient: '[node:field_e_mail:value]'
    successors: {  }
