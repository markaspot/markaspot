langcode: en
status: true
dependencies:
  config:
    - field.field.node.service_request.field_category
    - field.field.node.service_request.field_e_mail
    - field.field.node.service_request.field_jurisdiction
    - field.field.node.service_request.field_notification
    - field.storage.node.field_category
    - field.storage.node.field_e_mail
    - field.storage.node.field_jurisdiction
    - field.storage.node.field_notification
    - node.type.service_request
  module:
    - eca_content
    - markaspot_token
id: process_confirm_report
modeller: bpmn_io
label: 'Confirm Report'
version: '1.0'
weight: 10
events:
  Event_confirm_insert:
    plugin: 'content_entity:insert'
    label: 'Service Request Created'
    configuration:
      type: 'node service_request'
    successors:
      -
        id: Activity_send_confirmation
        condition: Condition_notification_enabled
conditions:
  Condition_notification_enabled:
    plugin: eca_entity_field_value
    configuration:
      expected_value: '1'
      field_name: field_notification.value
      operator: equal
      type: value
      case: true
      negate: false
      entity: ''
gateways: {  }
actions:
  Activity_send_confirmation:
    plugin: action_send_email_action
    label: 'Send Confirmation Email'
    configuration:
      object: 'entity'
      recipient: '[node:field_e_mail:value]'
      subject: 'Your Report #[node:request_id] has been received'
      message: |-
        Your report #[node:request_id] has been received.

        Category: [node:field_category:entity:name]
        Description: [node:body:value]

        [node:initial_status_note]

        You can check the status of your report at any time:
        [site:url][node:url:path]

        --
        [node:field_jurisdiction:entity:field_email_footer:value]

        [node:field_jurisdiction:entity:field_jurisdiction_address:organization]
        [node:field_jurisdiction:entity:field_jurisdiction_address:address_line1]
        [node:field_jurisdiction:entity:field_jurisdiction_address:postal_code] [node:field_jurisdiction:entity:field_jurisdiction_address:locality]
        [node:field_jurisdiction:entity:field_jurisdiction_e_mail]
      replace_tokens: true
    successors: {  }
