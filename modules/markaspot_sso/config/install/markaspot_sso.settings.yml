default_provider: keycloak
providers:
  keycloak:
    enabled: false
    label: 'Stadt-Login'
    profile: generic
    jurisdiction_id: 1
    org_id: 0
    default_role: member
    create_users: true
    link_by_email: false
    sp_entity_id: ''
    sp_acs_url: ''
    sp_x509_cert: ''
    sp_private_key_path: ''
    idp_entity_id: ''
    idp_sso_url: ''
    idp_x509_cert: ''
    name_id_format: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
    minimum_assurance_level: ''
    allowed_relay_hosts: { }
    default_relay_path: '/'
    attribute_map:
      email:
        - email
        - mail
        - 'urn:oid:0.9.2342.19200300.100.1.3'
      first_name:
        - givenName
        - 'urn:oid:2.5.4.42'
      last_name:
        - sn
        - surname
        - 'urn:oid:2.5.4.4'
      full_name:
        - displayName
        - cn
        - 'urn:oid:2.5.4.3'
      assurance_level:
        - assuranceLevel
        - loa
        - acr
    security:
      authn_requests_signed: false
      want_assertions_signed: true
      want_messages_signed: false
  local_mock:
    enabled: false
    label: 'SSO Demo'
    profile: generic_mock
    mock: true
    jurisdiction_id: 1
    org_id: 0
    default_role: member
    create_users: true
    link_by_email: false
    sp_entity_id: ''
    sp_acs_url: ''
    sp_x509_cert: ''
    sp_private_key_path: ''
    idp_entity_id: ''
    idp_sso_url: ''
    idp_x509_cert: ''
    name_id_format: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
    minimum_assurance_level: ''
    allowed_relay_hosts: { }
    default_relay_path: '/'
    attribute_map:
      email:
        - email
        - mail
      first_name:
        - first_name
        - givenName
      last_name:
        - last_name
        - sn
        - surname
      full_name:
        - full_name
        - displayName
      assurance_level:
        - assurance_level
        - loa
        - acr
    mock_claims:
      subject: 'markaspot-demo-staff'
      email: 'staff@example.org'
      first_name: Staff
      last_name: Member
      full_name: Staff Member
      assurance_level: high
    security:
      authn_requests_signed: false
      want_assertions_signed: false
      want_messages_signed: false
