  methods: [POST]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\ContentTranslationController::accessCheck'
    entity_type: '[a-z_]+'
    uuid: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    langcode: '[a-z]{2}(-[A-Z]{2})?'
