markaspot_nuxt.settings:
  path: '/admin/structure/markaspot/nuxt/settings'
  defaults:
    _form: '\Drupal\markaspot_nuxt\Form\MarkaspotNuxtSettingsForm'
    _title: 'Frontend Settings'
  requirements:
    _permission: 'administer site configuration'
markaspot_nuxt.form_mode_settings:
  path: '/api/mark-a-spot-form-mode-settings/{entity_type}/{bundle}/{form_mode}'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getFormModeSettings'
    _title: 'Form Mode Settings'
  requirements:
    _permission: 'access content'
markaspot_nuxt.markaspot_settings:
  path: '/api/mark-a-spot-settings'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getMarkASpotSettings'
    _title: 'Mark-a-Spot Settings'
  requirements:
    _permission: 'access content'
markaspot_nuxt.vote_sum:
  path: '/api/vote-sum/{uuid}'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\VotingApiController::voteSum'
    _format: 'json'
  requirements:
    _permission: 'access content'
markaspot_nuxt.field_options:
  path: '/api/field-options/{entity_type}/{field_name}'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getFieldOptions'
    _title: 'Field Options'
  requirements:
    _permission: 'access content'

markaspot_nuxt.fonts_css:
  path: '/api/fonts.css'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getFontsCss'
    _title: 'Custom Fonts CSS'
  requirements:
    _access: 'TRUE'

markaspot_nuxt.jurisdictions:
  path: '/api/jurisdictions'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getJurisdictions'
    _format: 'json'
  requirements:
    _permission: 'access content'

markaspot_nuxt.jurisdiction_hosts:
  path: '/api/jurisdiction-hosts'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getJurisdictionHosts'
    _format: 'json'
  requirements:
    _access: 'TRUE'

markaspot_nuxt.organisations:
  path: '/api/organisations'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\MarkASpotSettingsController::getOrganisations'
    _format: 'json'
  requirements:
    _permission: 'access content'

markaspot_nuxt.tenant_settings_logo:
  path: '/api/tenant-settings/{jurisdiction_id}/logo'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::uploadLogo'
    _title: 'Upload Tenant Logo'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    _csrf_token: 'TRUE'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_general_get:
  path: '/api/tenant-settings/{jurisdiction_id}/general'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::getGeneralSettings'
    _title: 'Get Tenant General Settings'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_general_patch:
  path: '/api/tenant-settings/{jurisdiction_id}/general'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::updateGeneralSettings'
    _title: 'Update Tenant General Settings'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_languages_get:
  path: '/api/tenant-settings/{jurisdiction_id}/languages'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::getLanguageSettings'
    _title: 'Get Tenant Language Settings'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_languages_patch:
  path: '/api/tenant-settings/{jurisdiction_id}/languages'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::updateLanguageSettings'
    _title: 'Update Tenant Language Settings'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_branding_get:
  path: '/api/tenant-settings/{jurisdiction_id}/branding'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::getBrandingSettings'
    _title: 'Get Tenant Branding Settings'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'

markaspot_nuxt.tenant_settings_branding_patch:
  path: '/api/tenant-settings/{jurisdiction_id}/branding'
  defaults:
    _controller: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::updateBrandingSettings'
    _title: 'Update Tenant Branding Settings'
  methods: [PATCH]
  requirements:
    _custom_access: '\Drupal\markaspot_nuxt\Controller\TenantSettingsController::accessCheck'
    jurisdiction_id: '[a-z0-9_-]+'
  options:
    _format: 'json'
