services:
  markaspot_nuxt.public_url_validator:
    class: Drupal\markaspot_nuxt\Service\PublicUrlValidator

  markaspot_nuxt.voting_api_controller:
    class: Drupal\markaspot_nuxt\Controller\VotingApiController
    arguments: ['@entity_type.manager']
  markaspot_nuxt.frontend_url:
    class: Drupal\markaspot_nuxt\Service\FrontendUrlService
    arguments: ['@config.factory', '@markaspot_nuxt.public_url_validator']
  markaspot_nuxt.feature_flag_checker:
    class: Drupal\markaspot_nuxt\Service\FeatureFlagChecker
  markaspot_nuxt.feature_scope_resolver:
    class: Drupal\markaspot_nuxt\Service\FeatureScopeResolver
    arguments: ['@entity_type.manager', '@config.factory', '@markaspot_group.hierarchy_resolver', '@module_handler']
  markaspot_nuxt.citizen_wording_resolver:
    class: Drupal\markaspot_nuxt\Service\CitizenWordingResolver
  markaspot_nuxt.feature_flag_access_check:
    class: Drupal\markaspot_nuxt\Access\FeatureFlagAccessCheck
    arguments: ['@markaspot_nuxt.feature_flag_checker', '@request_stack', '@entity_type.manager', '@config.factory']
  markaspot_nuxt.enterprise_feature_gate:
    class: Drupal\markaspot_nuxt\Service\EnterpriseFeatureGate
  markaspot_nuxt.enterprise_feature_access_check:
    class: Drupal\markaspot_nuxt\Access\EnterpriseFeatureAccessCheck
    arguments: ['@markaspot_nuxt.enterprise_feature_gate', '@entity_type.manager', '@config.factory', '@?markaspot_group.hierarchy_resolver']
  markaspot_nuxt.user_jsonapi_access_check:
    class: Drupal\markaspot_nuxt\Access\UserJsonApiAccessCheck
  markaspot_nuxt.user_jsonapi_route_subscriber:
    class: Drupal\markaspot_nuxt\Routing\UserJsonApiRouteSubscriber
    tags:
      - { name: event_subscriber }

  plugin.manager.markaspot_tenant_alert:
    class: Drupal\markaspot_nuxt\TenantAlertPluginManager
    parent: default_plugin_manager

  markaspot_nuxt.alert_state_store:
    class: Drupal\markaspot_nuxt\Service\AlertStateStore
    arguments: ['@user.data', '@datetime.time']

  # Note: Boolean helper and json_form.* service overrides are registered
  # dynamically via MarkaspotNuxtServiceProvider when json_form_widget is active.
  # This allows updates from versions where json_form_widget was not installed.
