services:
  markaspot_vision.image_processing:
    class: Drupal\markaspot_vision\Service\ImageProcessingService
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@entity_type.manager'
      - '@file_system'
      - '@logger.factory'
      - '@state'
      - '@datetime.time'
      - '@file.usage'
      - '@?markaspot_nuxt.citizen_wording_resolver'
      - '@module_handler'
  markaspot_vision.original_image_store:
    class: Drupal\markaspot_vision\Service\OriginalImageStore
    arguments:
      - '@config.factory'
      - '@database'
      - '@entity_type.manager'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@datetime.time'
      - '@state'
      - '@logger.factory'
      - '@?markaspot_open311.status_classifier'
  markaspot_vision.media_analysis_access_guard:
    class: Drupal\markaspot_vision\Service\MediaAnalysisAccessGuard
    arguments:
      - '@current_user'
      - '@keyvalue.expirable'
      - '@request_stack'
  markaspot_vision.media_tenant_scope:
    class: Drupal\markaspot_vision\Service\MediaTenantScopeResolver
    arguments:
      - '@entity_type.manager'
      - '@keyvalue'
      - '@config.factory'
      - '@state'
  markaspot_vision.image_processing_controller:
    class: Drupal\markaspot_vision\Controller\ImageProcessingController
    arguments:
      - '@markaspot_vision.image_processing'
      - '@logger.factory'
      - '@flood'
      - '@markaspot_nuxt.feature_scope_resolver'
      - '@markaspot_vision.media_analysis_access_guard'
      - '@config.factory'
      - '@markaspot_vision.media_tenant_scope'
    tags:
      - { name: controller.service_arguments }
