markaspot_vision.settings:
  type: config_object
  label: 'Mark-a-Spot Vision settings'
  mapping:
    multiple_uploads:
      type: boolean
      label: 'Allow multiple file uploads'
    rate_limit_max:
      type: integer
      label: 'Maximum vision analysis requests per hour'
    auth_type:
      type: string
      label: 'Authentication Type'
    api_key:
      type: string
      label: 'API Key'
    api_url:
      type: uri
      label: 'AI Service API URL'
    ai_model:
      type: string
      label: 'AI Model'
    system_prompt:
      type: text
      label: 'System Prompt'
    image_prompt:
      type: text
      label: 'Image Processing Prompt'
    temperature:
      type: float
      label: 'AI Temperature'
    top_p:
      type: float
      label: 'Top P'
    max_tokens:
      type: integer
      label: 'Max Tokens'
    require_ai_screening:
      type: boolean
      label: 'Require AI screening before publishing media'
    enable_blur_preprocessing:
      type: boolean
      label: 'Enable blur preprocessing'
    blur_service_url:
      type: string
      label: 'Blur Service URL'
    max_tokens_param:
      type: string
      label: 'Token limit parameter'
      constraints:
        Choice: [max_tokens, max_completion_tokens, none]
    response_format_mode:
      type: string
      label: 'Response format mode'
      constraints:
        Choice: [json_schema, json_object, none]
