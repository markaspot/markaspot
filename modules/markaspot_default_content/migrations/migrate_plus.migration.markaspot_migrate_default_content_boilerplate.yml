id: markaspot_migrate_default_content_boilerplate
label: 'Import boilerplate nodes'
migration_group: custom
source:
  plugin: csv
  path: /artifacts/boilerplate.csv
  header_row_count: 1
  ids: [uuid]
process:
  uuid: uuid
  langcode:
    plugin: default_value
    default_value: en
  title: title
  body/value: body
  body/format:
    plugin: default_value
    default_value: full_html
  field_jurisdiction:
    plugin: migration_lookup
    migration: markaspot_migrate_default_content_group_jurisdiction
    source: jurisdiction_uuid
destination:
  plugin: 'entity:node'
  default_bundle: boilerplate
migration_dependencies:
  required:
    - markaspot_migrate_default_content_group_jurisdiction
