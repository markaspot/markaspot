id: markaspot_migrate_default_content_group_organisation
label: 'Import organisation groups'
migration_group: custom
source:
  plugin: csv
  path: /artifacts/group_organisation.csv
  header_row_count: 1
  ids: [uuid]
process:
  uuid: uuid
  langcode: langcode
  type:
    plugin: default_value
    default_value: org
  label: label
  field_head_organisation_e_mail: field_head_organisation_e_mail
  field_jurisdiction:
    plugin: migration_lookup
    migration: markaspot_migrate_default_content_group_jurisdiction
    source: jurisdiction_uuid
destination:
  plugin: 'entity:group'
  default_bundle: org
migration_dependencies:
  required:
    - markaspot_migrate_default_content_group_jurisdiction
