id: markaspot_migrate_default_content_page
label: 'Import page nodes'
migration_group: custom
source:
  plugin: csv
  path: /artifacts/page.csv
  header_row_count: 1
  ids: [uuid]
process:
  uuid: uuid
  langcode:
    plugin: default_value
    default_value: en
  title: title
  body/value: body
  body/format:
    plugin: default_value
    default_value: full_html
  promote:
    plugin: default_value
    default_value: 1
  sticky: sticky
  field_page_icon: field_page_icon
  field_jurisdiction:
    plugin: migration_lookup
    migration: markaspot_migrate_default_content_group_jurisdiction
    source: jurisdiction_uuid
destination:
  plugin: 'entity:node'
  default_bundle: page
migration_dependencies:
  required:
    - markaspot_migrate_default_content_group_jurisdiction
