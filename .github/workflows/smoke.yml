name: smoke

on:
  pull_request:
    branches:
      - 11.9.x-dev
      - main
  push:
    branches:
      - 11.9.x-dev

# Single concurrent run per ref. Cancels superseded runs so a rapid push
# stream does not pile up half-finished smoke jobs against the same SHA.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drush-smoke:
    name: drush markaspot:smoke (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
          MARIADB_USER: drupal
          MARIADB_PASSWORD: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout profile under test
        uses: actions/checkout@v4
        with:
          path: profile-source

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, opcache, pdo_mysql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Bootstrap a Drupal site that uses this profile
        run: |
          set -euo pipefail
          composer create-project drupal/recommended-project:^11 site --no-interaction --no-progress
          cd site
          # Wire the profile under test in via a path repository so the
          # smoke runs against the workflow checkout, not a tagged release.
          # asset-packagist is required because the profile pulls
          # npm-asset/leaflet et al through its composer.json.
          composer config repositories.local-profile path "${GITHUB_WORKSPACE}/profile-source"
          composer config repositories.asset-packagist composer https://asset-packagist.org
          composer config minimum-stability dev
          composer config prefer-stable true
          # Drupal's composer plugins must be explicitly allowed in non-
          # interactive contexts. The set below covers core scaffold + the
          # plugins the markaspot profile chain typically pulls.
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.cweagans/composer-patches true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.oomphinc/composer-installers-extender true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.php-http/discovery true
          # Single command: modifies composer.json AND resolves the new
          # dependency. Splitting into `--no-update` plus a follow-up
          # `composer install` would silently leave the lockfile pointing
          # at the original recommended-project deps, so the profile would
          # never actually be installed.
          # drush/drush is requested alongside because drupal/recommended-
          # project does not pull it transitively and the smoke step shells
          # out via vendor/bin/drush. The mark-a-spot site template pins
          # drush:13, mirror that here.
          composer require drupal/markaspot:'*' drush/drush:^13 --with-all-dependencies --no-interaction --no-progress

      - name: Install Drupal (markaspot profile)
        working-directory: site
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          set -euo pipefail
          php vendor/bin/drush site:install markaspot \
            --db-url="mysql://drupal:drupal@${DB_HOST}:${DB_PORT}/drupal" \
            --site-name="markaspot CI" \
            --account-name=admin \
            --account-pass=admin \
            --yes

      - name: Start built-in PHP server (background)
        working-directory: site
        run: |
          php -S 127.0.0.1:8080 -t web .ht.router.php > /tmp/phpserver.log 2>&1 &
          echo $! > /tmp/phpserver.pid
          # Give the server a moment to bind.
          sleep 2

      - name: Run smoke (read-only, JUnit)
        working-directory: site
        run: |
          set -euo pipefail
          php vendor/bin/drush markaspot:smoke \
            --severity=error \
            --exit-non-zero \
            --format=junit \
            > smoke.junit.xml

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/phpserver.pid ]; then
            kill "$(cat /tmp/phpserver.pid)" 2>/dev/null || true
          fi

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-junit
          path: site/smoke.junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Surface failures in the PR check summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: site/smoke.junit.xml
          require_tests: true
          fail_on_failure: true
