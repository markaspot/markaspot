name: Tests

# Unit and kernel tests of the profile, run inside the public mark-a-spot
# template with this checkout swapped in as markaspot/markaspot. Kernel tests
# are spread over four jobs (see .github/scripts/phpunit-shard.php).

on:
  push:
    branches: ['11.9.x-dev', 'ci/**']
  pull_request:
    branches: ['11.9.x-dev']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARDS: 4
  # MariaDB like production; the profile has MariaDB-specific SQL.
  SIMPLETEST_DB: mysql://root:root@127.0.0.1:3306/drupal
  SIMPLETEST_BASE_URL: http://localhost
  COMPOSER_NO_INTERACTION: 1

jobs:
  test:
    name: ${{ matrix.suite }}${{ matrix.suite == 'kernel' && format(' {0}', matrix.shard) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            shard: 0
          - suite: kernel
            shard: 0
          - suite: kernel
            shard: 1
          - suite: kernel
            shard: 2
          - suite: kernel
            shard: 3
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: profile
          persist-credentials: false

      - name: Check out the mark-a-spot template
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markaspot/mark-a-spot
          ref: 11.9.x-dev
          path: site
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: gd, intl, mbstring, pdo_mysql, zip, bcmath, exif, apcu
          # 2.10.2 and later reject asset-packagist names the profile uses.
          tools: composer:2.10.1
          coverage: none

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('site/composer.lock', 'profile/composer.json') }}
          restore-keys: composer-

      - name: Install the site with this profile
        working-directory: site
        env:
          # Many dists come from GitHub; anonymous downloads share a small
          # rate limit per runner. Only this step sees the token.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Put this checkout first, copied (a symlink would resolve the
          # profile's relative bootstrap path outside web/), and pin its
          # version: a detached checkout has no branch to guess it from.
          # The template still defines maplibre-gl 4.5.0 inline while the
          # profile needs ^6.4.1; use the definition the cloud build ships.
          # The template's VCS entry for the profile goes: the path entry
          # replaces it, and five jobs scanning its tags trip GitHub's limits.
          # The profile's own composer.json names it drupal/markaspot, while
          # the template requires the Packagist name markaspot/markaspot:
          # require the checkout's name, or Packagist wins with the release.
          jq '.require |= (del(."markaspot/markaspot") + {"drupal/markaspot": "dev-11.9.x-dev"})
            | .repositories = [
                {"type": "path", "url": "../profile", "options": {"symlink": false, "versions": {"drupal/markaspot": "dev-11.9.x-dev"}}},
                {"type": "package", "canonical": true, "package": {"name": "npm-asset/maplibre-gl", "version": "6.4.1", "type": "npm-asset", "license": "BSD-3-Clause", "dist": {"type": "tar", "url": "https://registry.npmjs.org/maplibre-gl/-/maplibre-gl-6.4.1.tgz", "shasum": "34ae00dbbdef965f6519948ff131758f544d3696"}}}
              ] + [.repositories[] | select((.type != "package" or .package.name != "npm-asset/maplibre-gl") and ((.url // "") | test("github.com/markaspot/markaspot") | not))]' composer.json > composer.json.ci
          mv composer.json.ci composer.json
          composer config repositories | head -c 600; echo
          composer update drupal/markaspot markaspot/markaspot npm-asset/maplibre-gl --with-dependencies --no-progress
          test -f web/profiles/contrib/markaspot/markaspot.profile
          test ! -L web/profiles/contrib/markaspot
          # Prove the tests below run this checkout, not a published release.
          diff -rq --exclude=.git ../profile web/profiles/contrib/markaspot

      - name: Run the unit tests
        if: matrix.suite == 'unit'
        working-directory: site/web
        run: ../vendor/bin/phpunit -c profiles/contrib/markaspot/phpunit.xml.dist --testsuite unit --fail-on-empty-test-suite

      - name: Run kernel shard ${{ matrix.shard }}
        if: matrix.suite == 'kernel'
        working-directory: site/web
        run: |
          php ../../profile/.github/scripts/phpunit-shard.php profiles/contrib/markaspot ${{ matrix.shard }} "$SHARDS" > profiles/contrib/markaspot/phpunit.shard.xml
          ../vendor/bin/phpunit -c profiles/contrib/markaspot/phpunit.shard.xml --testsuite shard
